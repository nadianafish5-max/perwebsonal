<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Client Registration - Secure Vault</title>
    <style>
        :root {
            --bg-dark: #030712;
            --bg-card: rgba(17, 24, 39, 0.95);
            --border-color: rgba(55, 65, 81, 0.6);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-blue: #2563eb;
            --accent-cyan: #06b6d4;
            --accent-green: #059669;
            --accent-red: #dc2626;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: linear-gradient(135deg, #030712 0%, #0f172a 50%, #1e1b4b 100%); color: var(--text-main); height: 100vh; display: flex; justify-content: center; align-items: center; margin: 0; }
        .auth-card { background: var(--bg-card); border: 1px solid var(--border-color); padding: 2rem; border-radius: 20px; width: 100%; max-width: 420px; box-shadow: 0 20px 40px rgba(0,0,0,0.7); text-align: center; }
        input, textarea { width: 100%; padding: 0.75rem; margin: 0.4rem 0 0.8rem 0; border: 1px solid var(--border-color); border-radius: 10px; background: rgba(3, 7, 18, 0.7); color: white; outline: none; font-size: 0.85rem; }
        textarea { resize: none; height: 80px; }
        button { width: 100%; padding: 0.8rem; background: var(--accent-blue); color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 0.9rem; }
        .link-text { font-size: 0.8rem; color: var(--accent-cyan); cursor: pointer; margin-top: 1rem; display: block; text-decoration: underline; }
        .error { color: var(--accent-red); font-size: 0.85rem; margin-top: 0.4rem; }
        .success { color: var(--accent-green); font-size: 0.85rem; margin-top: 0.4rem; }
    </style>
</head>
<body>
    <div class="auth-card">
        <h2>📝 Global Client Registration</h2>
        <p style="color: var(--text-muted); font-size: 0.78rem; margin-bottom: 1rem;">Direct Hardware Binding & Admin Message</p>
        <input type="text" id="reg-username" placeholder="Choose Username" autocomplete="off">
        <input type="password" id="reg-password" placeholder="Choose Password">
        <textarea id="reg-admin-msg" placeholder="Message directly to Admin (Purpose of access, inquiry)..."></textarea>
        <button onclick="submitRegistration()">Submit Registration</button>
        <span class="link-text" onclick="window.location.href='index.html'">Already registered? Sign In</span>
        <div id="reg-status"></div>
    </div>

    <script>
        const GITHUB_REPO_OWNER = "nadianafish5-max";
        const GITHUB_VAULT_REPO = "perwebsonal";
        const tokA = "github_pat_11CLG5N3I0k";
        const tokB = "a4ywlHFWZm9_jvpLkxbPap";
        const tokC = "vBQlncSmFNVt6gNeQBkqRjI6Gh53drCUBPGR4ZTTYamYub8Sq";
        const GITHUB_TOKEN = tokA + tokB + tokC;

        function getDeviceName() {
            let savedName = localStorage.getItem("enterprise_device_id");
            if (savedName) return savedName;
            const ua = navigator.userAgent;
            let name = /android/i.test(ua) ? "Android Device" : /win/i.test(ua) ? "Windows PC" : "Standard Workstation";
            localStorage.setItem("enterprise_device_id", name + " - " + screen.width + "x" + screen.height);
            return localStorage.getItem("enterprise_device_id");
        }

        async function submitRegistration() {
            const user = document.getElementById("reg-username").value.trim();
            const pass = document.getElementById("reg-password").value;
            const adminMsg = document.getElementById("reg-admin-msg").value.trim();
            const status = document.getElementById("reg-status");

            if (!user || !pass || !adminMsg) {
                status.innerHTML = '<div class="error">Please fill in all required fields.</div>';
                return;
            }

            const url = `https://api.github.com/repos/${GITHUB_REPO_OWNER}/${GITHUB_VAULT_REPO}/contents/users.json`;
            try {
                const res = await fetch(url, { headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Cache-Control': 'no-cache' } });
                let db = {}, sha = "";
                if (res.ok) {
                    const data = await res.json();
                    sha = data.sha;
                    db = JSON.parse(atob(data.content));
                }

                if (db[user]) {
                    status.innerHTML = '<div class="error">Username already taken.</div>';
                    return;
                }

                db[user] = {
                    passHash: pass,
                    role: "client",
                    vip: false,
                    allowedDevices: [getDeviceName()],
                    approved: false,
                    email: "Not Bound Yet",
                    adminMsg: adminMsg,
                    violations: []
                };

                const putRes = await fetch(url, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: `New Client Registration: ${user}`, content: btoa(JSON.stringify(db, null, 2)), sha: sha || undefined })
                });

                if (putRes.ok) {
                    status.innerHTML = '<div class="success">✅ Registration successful! Awaiting Admin approval.</div>';
                    setTimeout(() => window.location.href = 'index.html', 2500);
                } else {
                    status.innerHTML = '<div class="error">Server sync failed. Try again.</div>';
                }
            } catch (e) {
                status.innerHTML = '<div class="error">Network error during registration.</div>';
            }
        }
    </script>
</body>
</html>

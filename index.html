<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Secure Cloud Vault - Enterprise Android Edition</title>
    <style>
        :root {
            --bg-dark: #090d16;
            --bg-card: rgba(17, 24, 39, 0.95);
            --border-color: rgba(55, 65, 81, 0.6);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-blue: #2563eb;
            --accent-cyan: #06b6d4;
            --accent-green: #059669;
            --accent-red: #dc2626;
            --accent-purple: #7c3aed;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: linear-gradient(135deg, #030712 0%, #0f172a 50%, #1e1b4b 100%); color: var(--text-main); margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        header { height: 65px; background: rgba(15, 23, 42, 0.95); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 1.2rem; flex-shrink: 0; }
        .logo-area { font-size: 1.1rem; font-weight: 700; color: #fff; }
        
        #login-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #030712; display: flex; justify-content: center; align-items: center; z-index: 3000; padding: 1rem; }
        .auth-card { background: var(--bg-card); border: 1px solid var(--border-color); padding: 2rem; border-radius: 20px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.7); }
        .auth-card input { width: 100%; padding: 0.8rem; margin: 0.4rem 0 0.8rem 0; border: 1px solid var(--border-color); border-radius: 10px; background: rgba(3, 7, 18, 0.7); color: white; outline: none; font-size: 0.9rem; }
        .auth-card button { width: 100%; padding: 0.85rem; background: var(--accent-blue); color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; font-size: 0.95rem; }

        .main-layout { display: flex; flex: 1; height: calc(100vh - 65px); overflow: hidden; }
        sidebar { width: 220px; background: #0b1120; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 1.2rem 0.6rem; flex-shrink: 0; overflow-y: auto; }
        .nav-item { padding: 0.7rem 0.9rem; border-radius: 10px; cursor: pointer; font-size: 0.85rem; color: var(--text-muted); display: flex; align-items: center; gap: 0.7rem; margin-bottom: 0.3rem; text-decoration: none; }
        .nav-item:hover, .nav-item.active { background: rgba(37, 99, 235, 0.15); color: var(--accent-cyan); }
        .content-area { flex: 1; padding: 1.5rem; overflow-y: auto; background: rgba(3, 7, 18, 0.3); }

        table { width: 100%; border-collapse: collapse; margin-top: 0.8rem; font-size: 0.85rem; min-width: 600px; }
        th, td { border-bottom: 1px solid var(--border-color); padding: 0.8rem; text-align: left; }
        th { color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; }
        .table-responsive { width: 100%; overflow-x: auto; }
        .error { color: var(--accent-red); font-size: 0.85rem; margin-top: 0.4rem; }
        .badge-device { background: rgba(6, 182, 212, 0.15); color: #22d3ee; padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; font-family: monospace; }
        
        .create-user-box { background: var(--bg-card); border: 1px solid var(--border-color); padding: 1.2rem; border-radius: 12px; margin-bottom: 1.5rem; }
        .create-user-box input { padding: 0.6rem; margin-right: 0.5rem; background: #030712; border: 1px solid var(--border-color); color: white; border-radius: 8px; }
    </style>
</head>
<body>

    <!-- Login Screen -->
    <div id="login-screen">
        <div class="auth-card">
            <h2>🌐 Secure Cloud Vault</h2>
            <p style="color: var(--text-muted); font-size: 0.8rem; margin-bottom: 1.2rem;">Enterprise Client Login</p>
            <input type="text" id="username-input" placeholder="Assigned Username" autocomplete="off">
            <input type="password" id="password-input" placeholder="Password">
            <button onclick="attemptLogin()">Sign In</button>
            <span style="font-size: 0.85rem; color: var(--accent-cyan); cursor: pointer; margin-top: 1.2rem; display: block;" onclick="window.location.href='register.html'">New Device? Register Device Here</span>
            <div id="error-msg" class="error"></div>
        </div>
    </div>

    <!-- Header -->
    <header>
        <div class="logo-area">🌐 Secure Cloud Vault</div>
        <div id="user-display" style="font-size: 0.85rem; color: var(--accent-cyan);">User</div>
    </header>

    <div class="main-layout">
        <sidebar>
            <a class="nav-item active" onclick="switchCategory('videos', this)">🎬 <span>Videos Vault</span></a>
            <a class="nav-item" onclick="switchCategory('audio', this)">🎵 <span>Audio Vault</span></a>
            <a class="nav-item" onclick="switchCategory('files', this)">📁 <span>Documents</span></a>
            <a class="nav-item" onclick="switchCategory('chat', this)">💬 <span>Community Chat</span></a>
            <a class="nav-item" onclick="window.location.href='profile.html'">👤 <span>Profile & Accounts</span></a>
            <a class="nav-item" id="admin-menu" onclick="switchCategory('admin', this)" style="display:none; background:rgba(217, 119, 6, 0.2); color:#fbbf24; border:1px solid rgba(217, 119, 6, 0.4);">👑 <span>Admin Management</span></a>
            <a class="nav-item" onclick="logout()" style="color: var(--accent-red); margin-top: auto;">🚪 <span>Logout</span></a>
        </sidebar>

        <div class="content-area">
            <div id="dynamic-content">
                <h2>Loading Vault...</h2>
            </div>
        </div>
    </div>

    <script>
        const GITHUB_REPO_OWNER = "nadianafish5-max";
        const GITHUB_VAULT_REPO = "perwebsonal";
        const tokA = "github_pat_11CLG5N3I0k";
        const tokB = "a4ywlHFWZm9_jvpLkxbPap";
        const tokC = "vBQlncSmFNVt6gNeQBkqRjI6Gh53drCUBPGR4ZTTYamYub8Sq";
        const GITHUB_TOKEN = tokA + tokB + tokC;

        let currentUser = null;
        let CLIENT_DB = {};
        let usersSha = "";

        function utoa(str) { return window.btoa(unescape(encodeURIComponent(str))); }
        function atou(str) { return decodeURIComponent(escape(window.atob(str))); }

        function getAndroidDeviceFingerprint() {
            let saved = localStorage.getItem("vault_device_fingerprint");
            if (saved) return saved;
            const ua = navigator.userAgent;
            let label = "Android/Standard Device";
            if (/android/i.test(ua)) {
                let match = ua.match(/;\s*([^;]+)\s+Build\//) || ua.match(/\(([^)]+)\)/);
                label = match && match[1] ? "Android: " + match[1].split(';').pop().trim() : "Android Mobile";
            } else if (/iphone|ipad/i.test(ua)) {
                label = "Apple iOS Device";
            } else if (/win/i.test(ua)) {
                label = "Windows Workstation";
            }
            let fingerprint = label + " (" + screen.width + "x" + screen.height + ")";
            localStorage.setItem("vault_device_fingerprint", fingerprint);
            return fingerprint;
        }

        window.onload = async function() {
            await fetchUsersDb();
            let savedUser = localStorage.getItem("enterprise_active_user");
            if (savedUser && CLIENT_DB[savedUser]) {
                currentUser = savedUser;
                document.getElementById("login-screen").style.display = "none";
                document.getElementById("user-display").innerText = "Logged in: " + currentUser;
                if (CLIENT_DB[currentUser].role === "admin") {
                    document.getElementById("admin-menu").style.display = "flex";
                }
                updateLiveDeviceStatus();
                switchCategory('videos');
            }
        };

        async function fetchUsersDb() {
            const url = `https://api.github.com/repos/${GITHUB_REPO_OWNER}/${GITHUB_VAULT_REPO}/contents/users.json`;
            try {
                const res = await fetch(url, { headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Cache-Control': 'no-cache' } });
                if (res.ok) {
                    const data = await res.json();
                    usersSha = data.sha;
                    CLIENT_DB = JSON.parse(atou(data.content));
                }
            } catch(e) {}
        }

        async function saveUsersDb() {
            const url = `https://api.github.com/repos/${GITHUB_REPO_OWNER}/${GITHUB_VAULT_REPO}/contents/users.json`;
            try {
                const resGet = await fetch(url, { headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Cache-Control': 'no-cache' } });
                if (resGet.ok) {
                    const dataGet = await resGet.json();
                    usersSha = dataGet.sha;
                }
            } catch(e) {}

            const putRes = await fetch(url, {
                method: 'PUT',
                headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: "Update users database", content: utoa(JSON.stringify(CLIENT_DB, null, 2)), sha: usersSha })
            });
            if (putRes.ok) {
                const dataPut = await putRes.json();
                usersSha = dataPut.content.sha;
            }
        }

        async function updateLiveDeviceStatus() {
            if (currentUser && CLIENT_DB[currentUser]) {
                let currentDev = getAndroidDeviceFingerprint();
                CLIENT_DB[currentUser].currentActiveDevice = currentDev;
                CLIENT_DB[currentUser].lastActiveTime = new Date().toLocaleString();
                await saveUsersDb();
            }
        }

        async function attemptLogin() {
            await fetchUsersDb();
            const user = document.getElementById("username-input").value.trim();
            const pass = document.getElementById("password-input").value;
            const err = document.getElementById("error-msg");

            if (!CLIENT_DB[user] || CLIENT_DB[user].passHash !== pass) {
                err.innerText = "Invalid credentials or username.";
                return;
            }

            let currentDev = getAndroidDeviceFingerprint();
            if (CLIENT_DB[user].role !== "admin" && CLIENT_DB[user].allowedDevices.length > 0 && !CLIENT_DB[user].allowedDevices.includes(currentDev)) {
                err.innerText = "Device not bound! Please register this device first using the link below.";
                return;
            }

            currentUser = user;
            localStorage.setItem("enterprise_active_user", currentUser);
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("user-display").innerText = "Logged in: " + currentUser;

            if (CLIENT_DB[currentUser].role === "admin") {
                document.getElementById("admin-menu").style.display = "flex";
            }
            await updateLiveDeviceStatus();
            switchCategory('videos');
        }

        function logout() {
            localStorage.removeItem("enterprise_active_user");
            location.reload();
        }

        async function switchCategory(cat, el) {
            if (el) {
                document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                el.classList.add('active');
            }
            const container = document.getElementById("dynamic-content");

            if (cat === 'videos' || cat === 'audio' || cat === 'files') {
                container.innerHTML = `<h2>📁 ${cat.toUpperCase()} Vault</h2><div class="table-responsive"><div id="file-table-view">Loading items...</div></div>`;
                fetchVaultFiles(cat);
            } else if (cat === 'chat') {
                container.innerHTML = `<h2>💬 Global Community Chat</h2>
                    <div style="display:flex; flex-direction:column; height:400px; border:1px solid var(--border-color); border-radius:14px; background:rgba(17,24,39,0.6); overflow:hidden;">
                        <div id="chat-msgs" style="flex:1; padding:1rem; overflow-y:auto; display:flex; flex-direction:column; gap:0.5rem;">Loading chat...</div>
                        <div style="display:flex; padding:0.6rem; background:#111827;">
                            <input type="text" id="chat-box-input" placeholder="Type message..." style="flex:1; padding:0.6rem; background:#030712; border:1px solid var(--border-color); color:white; border-radius:10px; outline:none;">
                            <button onclick="sendChatMessage()" style="margin-left:0.5rem; padding:0.6rem 1.2rem; background:var(--accent-blue); color:white; border:none; border-radius:10px; cursor:pointer;">Send</button>
                        </div>
                    </div>`;
                fetchChatMessages();
            } else if (cat === 'admin') {
                container.innerHTML = `<h2>👑 Admin Account & Device Management</h2>
                    <div class="create-user-box">
                        <h3>Create New Client Account</h3>
                        <input type="text" id="new-user" placeholder="Username">
                        <input type="password" id="new-pass" placeholder="Password">
                        <button onclick="createNewAccount()" style="padding:0.6rem 1.2rem; background:var(--accent-green); color:white; border:none; border-radius:8px; cursor:pointer; font-weight:bold;">Create Account</button>
                    </div>
                    <div class="table-responsive"><div id="admin-table-view">Loading accounts registry...</div></div>`;
                loadAdminRegistry();
            }
        }

        async function fetchVaultFiles(categoryFilter) {
            const view = document.getElementById("file-table-view");
            const url = `https://api.github.com/repos/${GITHUB_REPO_OWNER}/${GITHUB_VAULT_REPO}/contents/links.json`;
            try {
                const res = await fetch(url, { headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Cache-Control': 'no-cache' } });
                if (res.ok) {
                    const data = await res.json();
                    let items = JSON.parse(atou(data.content));
                    let html = `<table><thead><tr><th>Name</th><th>Action</th></tr></thead><tbody>`;
                    let found = false;
                    items.forEach(item => {
                        let isVid = /\.(mp4|webm|mkv)$/i.test(item.name);
                        let isAud = /\.(mp3|wav|aac)$/i.test(item.name);
                        let match = (categoryFilter === 'videos' && isVid) || (categoryFilter === 'audio' && isAud) || (categoryFilter === 'files' && !isVid && !isAud);
                        if (match) {
                            found = true;
                            html += `<tr><td>${item.name}</td><td><a href="${item.url}" target="_blank" download style="color:var(--accent-cyan); text-decoration:none; font-weight:bold;">Download ⬇️</a></td></tr>`;
                        }
                    });
                    html += `</tbody></table>`;
                    view.innerHTML = found ? html : `<p style="color:var(--text-muted);">No items found.</p>`;
                }
            } catch(e) { view.innerHTML = "Error loading files."; }
        }

        async function fetchChatMessages() {
            const chatContainer = document.getElementById("chat-msgs");
            if (!chatContainer) return;
            const url = `https://api.github.com/repos/${GITHUB_REPO_OWNER}/${GITHUB_VAULT_REPO}/contents/chat.json`;
            try {
                const res = await fetch(url, { headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Cache-Control': 'no-cache' } });
                if (res.ok) {
                    const data = await res.json();
                    let messages = JSON.parse(atou(data.content));
                    chatContainer.innerHTML = messages.map(m => `<div style="background:${m.user === currentUser ? '#2563eb' : '#374151'}; padding:0.5rem 0.8rem; border-radius:8px; max-width:75%; align-self:${m.user === currentUser ? 'flex-end' : 'flex-start'};"><b style="font-size:0.7rem; display:block; opacity:0.8;">${m.user}</b>${m.text}</div>`).join('');
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                }
            } catch(e) {}
        }

        async function sendChatMessage() {
            const input = document.getElementById("chat-box-input");
            if (!input.value.trim()) return;
            const text = input.value; input.value = "";
            const url = `https://api.github.com/repos/${GITHUB_REPO_OWNER}/${GITHUB_VAULT_REPO}/contents/chat.json`;
            try {
                const res = await fetch(url, { headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Cache-Control': 'no-cache' } });
                let messages = [], sha = "";
                if (res.ok) {
                    const data = await res.json();
                    sha = data.sha;
                    messages = JSON.parse(atou(data.content));
                }
                messages.push({ user: currentUser, text: text });
                await fetch(url, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: "Chat Update", content: utoa(JSON.stringify(messages, null, 2)), sha: sha || undefined })
                });
                fetchChatMessages();
            } catch(e) {}
        }

        async function loadAdminRegistry() {
            await fetchUsersDb();
            let view = document.getElementById("admin-table-view");
            let html = `<table><thead><tr><th>Username</th><th>Assigned Email</th><th>Live Active Device</th><th>Bound Devices Count</th><th>Action</th></tr></thead><tbody>`;
            for (let [u, data] of Object.entries(CLIENT_DB)) {
                let activeDev = data.currentActiveDevice ? `<span class="badge-device">📱 ${data.currentActiveDevice}</span>` : '<span style="color:var(--text-muted);">Offline</span>';
                html += `<tr>
                    <td><b>${u}</b> ${data.role === 'admin' ? '👑' : ''}</td>
                    <td>${data.email || 'N/A'}</td>
                    <td>${activeDev}<br><small style="color:var(--text-muted);">${data.lastActiveTime || ''}</small></td>
                    <td>${(data.allowedDevices || []).length} device(s)</td>
                    <td>
                        ${data.role !== 'admin' ? `<button onclick="adminDelete('${u}')" style="background:var(--accent-red); color:white; border:none; padding:5px 10px; border-radius:6px; cursor:pointer;">Delete Account 🗑️</button>` : 'N/A'}
                    </td>
                </tr>`;
            }
            html += `</tbody></table>`;
            view.innerHTML = html;
        }

        async function createNewAccount() {
            let u = document.getElementById("new-user").value.trim();
            let p = document.getElementById("new-pass").value;
            if(!u || !p) return alert("Enter username and password!");
            await fetchUsersDb();
            if(CLIENT_DB[u]) return alert("Username already exists!");

            CLIENT_DB[u] = {
                passHash: p,
                role: "client",
                vip: false,
                allowedDevices: [],
                approved: true,
                email: u + "@client.com",
                adminMsg: "Admin created account",
                currentActiveDevice: "Not Bound",
                lastActiveTime: "Never"
            };
            await saveUsersDb();
            alert(`Account ${u} created successfully!`);
            loadAdminRegistry();
        }

        async function adminDelete(u) {
            if(confirm(`Delete account ${u}?`)) {
                delete CLIENT_DB[u];
                await saveUsersDb();
                loadAdminRegistry();
            }
        }
    </script>
</body>
</html>

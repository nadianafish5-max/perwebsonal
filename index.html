<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; connect-src https://*.supabase.co wss://*.supabase.co; img-src 'self' data:; base-uri 'none'; form-action 'none'">
<title>Secure Client Vault</title>
<style>
:root{--bg:#0b1020;--card:#131a2e;--line:#26304d;--tx:#e8ecf6;--mut:#8f9bb8;--ac:#4f8cff;--ok:#22c55e;--bad:#ef4444}
*{box-sizing:border-box;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{margin:0;background:var(--bg);color:var(--tx);min-height:100vh}
.hide{display:none!important}
.center{min-height:100vh;display:grid;place-items:center;padding:1rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.5rem;width:100%;max-width:400px}
h1,h2,h3{margin:.2rem 0 .8rem}
input,select{width:100%;padding:.7rem;margin:.3rem 0 .7rem;background:#0b1020;border:1px solid var(--line);border-radius:9px;color:var(--tx);font-size:.9rem}
button{padding:.65rem 1rem;border:0;border-radius:9px;background:var(--ac);color:#fff;font-weight:600;cursor:pointer}
button.s{background:#2a3555}button.d{background:var(--bad)}button.g{background:var(--ok)}
.full{width:100%}.mut{color:var(--mut);font-size:.85rem}.lnk{color:var(--ac);cursor:pointer;font-size:.85rem;display:block;margin-top:.8rem;text-align:center}
#msg{margin-top:.6rem;font-size:.85rem;min-height:1.2em}
header{display:flex;justify-content:space-between;align-items:center;padding:.8rem 1.2rem;border-bottom:1px solid var(--line);background:var(--card)}
nav{display:flex;gap:.4rem;padding:.7rem 1.2rem;flex-wrap:wrap;border-bottom:1px solid var(--line)}
nav button{background:transparent;color:var(--mut)}nav button.on{background:#1b2848;color:var(--ac)}
main{max-width:900px;margin:1.2rem auto;padding:0 1rem}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{padding:.65rem;border-bottom:1px solid var(--line);text-align:left}th{color:var(--mut);font-size:.75rem;text-transform:uppercase}
.wrap{overflow-x:auto}
#chat{height:340px;overflow-y:auto;display:flex;flex-direction:column;gap:.4rem;background:#0b1020;border:1px solid var(--line);border-radius:10px;padding:.8rem}
.m{background:#1d2745;padding:.45rem .7rem;border-radius:8px;max-width:78%;word-break:break-word}.m.me{background:#27479b;align-self:flex-end}
.m b{display:block;font-size:.7rem;opacity:.75}
.row{display:flex;gap:.5rem}.row input{margin:0}
</style>
</head>
<body>

<!-- Auth -->
<div id="auth" class="center hide"><div class="card">
  <h1>🔐 Client Vault</h1>
  <p class="mut" id="auth-sub">Sign in to continue</p>
  <input id="a-user" class="hide" placeholder="Username" maxlength="30" autocomplete="username">
  <input id="a-email" type="email" placeholder="Email" autocomplete="email">
  <input id="a-pass" type="password" placeholder="Password (min 10 characters)" autocomplete="current-password">
  <button class="full" id="a-go">Sign in</button>
  <span class="lnk" id="a-toggle">No account? Request access</span>
  <span class="lnk" id="a-reset">Forgot password?</span>
  <div id="msg"></div>
</div></div>

<!-- Pending approval -->
<div id="pending" class="center hide"><div class="card" style="text-align:center">
  <h2>⏳ Awaiting approval</h2>
  <p class="mut">Your account was created. The administrator must approve it before you can access the vault.</p>
  <button class="s" onclick="sb.auth.signOut()">Sign out</button>
</div></div>

<!-- App -->
<div id="app" class="hide">
  <header><b>🔐 Client Vault</b><span><span class="mut" id="who"></span> <button class="s" onclick="sb.auth.signOut()">Sign out</button></span></header>
  <nav id="nav"></nav>
  <main id="view"></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// 1) Paste your values from Supabase -> Project Settings -> API. Use the "anon / public" key ONLY. Never the service_role key.
const SUPABASE_URL = "https://ivsevllqlzgoopgxecup.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_5V2h-PYn7rjY_Ax186rZkw_8ZY4sfSw";

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let me = null, chan = null, signup = false;

function say(t, ok) { const m = $("msg"); m.textContent = t; m.style.color = ok ? "var(--ok)" : "var(--bad)"; }
function show(id) { ["auth","pending","app"].forEach(x => $(x).classList.toggle("hide", x !== id)); }

// ---------- Auth ----------
$("a-toggle").onclick = () => {
  signup = !signup;
  $("a-user").classList.toggle("hide", !signup);
  $("a-go").textContent = signup ? "Request access" : "Sign in";
  $("a-toggle").textContent = signup ? "Already have an account? Sign in" : "No account? Request access";
  $("auth-sub").textContent = signup ? "Create your account (admin approval required)" : "Sign in to continue";
  $("a-pass").autocomplete = signup ? "new-password" : "current-password"; say("");
};
$("a-go").onclick = async () => {
  const email = $("a-email").value.trim(), password = $("a-pass").value, username = $("a-user").value.trim();
  if (!email || !password) return say("Enter email and password.");
  if (signup) {
    if (password.length < 10) return say("Password must be at least 10 characters.");
    if (username.length < 2) return say("Choose a username (2+ characters).");
    const { error } = await sb.auth.signUp({ email, password, options: { data: { username }, emailRedirectTo: location.origin + location.pathname } });
    return error ? say(error.message) : say("Account created. Check your email if confirmation is required, then sign in.", true);
  }
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) say("Invalid email or password.");
};
$("a-reset").onclick = async () => {
  const email = $("a-email").value.trim();
  if (!email) return say("Enter your email first.");
  await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
  say("If that email exists, a reset link was sent.", true);
};

sb.auth.onAuthStateChange((ev, session) => {
  if (ev === "PASSWORD_RECOVERY") {
    const p = prompt("Enter your new password (min 10 characters):");
    if (p && p.length >= 10) sb.auth.updateUser({ password: p }).then(r => alert(r.error ? r.error.message : "Password updated."));
  }
  setTimeout(() => boot(session), 0);
});

async function boot(session) {
  if (chan) { sb.removeChannel(chan); chan = null; }
  if (!session) { me = null; return show("auth"); }
  const { data } = await sb.from("profiles").select("*").eq("id", session.user.id).single();
  me = data && { ...data, email: session.user.email };
  if (!me) return show("auth");
  if (!me.approved) return show("pending");
  $("who").textContent = me.username + (me.role === "admin" ? " 👑" : "");
  const tabs = [["videos","🎬 Videos"],["audio","🎵 Audio"],["files","📁 Documents"],["chat","💬 Chat"],["profile","👤 Profile"]];
  if (me.role === "admin") tabs.push(["admin","👑 Admin"]);
  $("nav").innerHTML = tabs.map(t => `<button data-t="${t[0]}">${t[1]}</button>`).join("");
  $("nav").onclick = e => e.target.dataset.t && go(e.target.dataset.t);
  show("app"); go("videos");
}

// ---------- Views ----------
function go(t) {
  if (chan) { sb.removeChannel(chan); chan = null; }
  document.querySelectorAll("#nav button").forEach(b => b.classList.toggle("on", b.dataset.t === t));
  ({ videos: fileView, audio: fileView, files: fileView, chat: chatView, profile: profileView, admin: adminView })[t](t);
}

async function fileView(cat) {
  const v = $("view"); v.innerHTML = "<p class='mut'>Loading…</p>";
  const { data, error } = await sb.from("files").select("*").eq("category", cat).order("created_at", { ascending: false });
  if (error) return v.textContent = "Could not load files.";
  v.innerHTML = data.length ? `<div class="wrap"><table><tr><th>Name</th><th></th></tr>${data.map(f =>
    `<tr><td>${esc(f.name)}</td><td><button data-p="${esc(f.path)}" data-n="${esc(f.name)}">Download</button></td></tr>`).join("")}</table></div>`
    : "<p class='mut'>No items yet.</p>";
  v.onclick = async e => {
    const p = e.target.dataset && e.target.dataset.p; if (!p) return;
    const { data: s, error } = await sb.storage.from("vault").createSignedUrl(p, 60, { download: e.target.dataset.n });
    error ? alert("Download failed.") : window.open(s.signedUrl, "_blank", "noopener");
  };
}

async function chatView() {
  $("view").innerHTML = `<h2>Community Chat</h2><div id="chat"></div>
    <div class="row" style="margin-top:.6rem"><input id="c-in" maxlength="500" placeholder="Type a message…"><button id="c-send">Send</button></div>`;
  const add = m => {
    const d = document.createElement("div"); d.className = "m" + (m.user_id === me.id ? " me" : "");
    const b = document.createElement("b"); b.textContent = m.username || "user";
    d.append(b, document.createTextNode(m.body));   // textContent only: no script injection
    $("chat").append(d); $("chat").scrollTop = 1e9;
  };
  const { data } = await sb.from("messages").select("*").order("created_at", { ascending: false }).limit(50);
  (data || []).reverse().forEach(add);
  chan = sb.channel("chat").on("postgres_changes", { event: "INSERT", schema: "public", table: "messages" }, p => add(p.new)).subscribe();
  const send = async () => {
    const t = $("c-in").value.trim(); if (!t) return; $("c-in").value = "";
    const { error } = await sb.from("messages").insert({ body: t }); if (error) alert("Could not send.");
  };
  $("c-send").onclick = send; $("c-in").onkeydown = e => e.key === "Enter" && send();
}

function profileView() {
  $("view").innerHTML = `<div class="card"><h2>My Profile</h2>
    <label class="mut">Email</label><input value="${esc(me.email)}" readonly>
    <label class="mut">Username</label><input id="p-user" value="${esc(me.username)}" maxlength="30">
    <button id="p-save">Save</button>
    <h3 style="margin-top:1.2rem">Change password</h3>
    <input id="p-pass" type="password" placeholder="New password (min 10)" autocomplete="new-password">
    <button class="s" id="p-pw">Update password</button></div>`;
  $("p-save").onclick = async () => {
    const u = $("p-user").value.trim(); if (u.length < 2) return alert("Username too short.");
    const { error } = await sb.from("profiles").update({ username: u }).eq("id", me.id);
    if (!error) { me.username = u; $("who").textContent = u + (me.role === "admin" ? " 👑" : ""); } alert(error ? "Failed." : "Saved.");
  };
  $("p-pw").onclick = async () => {
    const p = $("p-pass").value; if (p.length < 10) return alert("Min 10 characters.");
    const { error } = await sb.auth.updateUser({ password: p }); alert(error ? error.message : "Password updated."); $("p-pass").value = "";
  };
}

async function adminView() {
  const v = $("view");
  v.innerHTML = `<h2>Admin</h2>
    <div class="card" style="max-width:none;margin-bottom:1rem"><h3>Upload file</h3>
      <div class="row"><input id="u-file" type="file"><select id="u-cat" style="width:auto"><option value="videos">Videos</option><option value="audio">Audio</option><option value="files">Documents</option></select><button id="u-go">Upload</button></div>
      <div class="mut" id="u-st"></div></div>
    <div class="card" style="max-width:none;margin-bottom:1rem"><h3>Accounts</h3><div class="wrap" id="acc">Loading…</div></div>
    <div class="card" style="max-width:none"><h3>Files</h3><div class="wrap" id="fl">Loading…</div></div>`;
  $("u-go").onclick = async () => {
    const f = $("u-file").files[0]; if (!f) return;
    const path = crypto.randomUUID() + "-" + f.name.replace(/[^\w.\-]/g, "_");
    $("u-st").textContent = "Uploading…";
    const up = await sb.storage.from("vault").upload(path, f);
    if (up.error) return $("u-st").textContent = "Upload failed: " + up.error.message;
    const ins = await sb.from("files").insert({ name: f.name, category: $("u-cat").value, path });
    $("u-st").textContent = ins.error ? "Saved file but failed to record it." : "Uploaded ✔"; adminLists();
  };
  adminLists();
}
async function adminLists() {
  const [pr, fl] = await Promise.all([sb.from("profiles").select("*").order("created_at"), sb.from("files").select("*").order("created_at", { ascending: false })]);
  $("acc").innerHTML = `<table><tr><th>User</th><th>Role</th><th>Status</th><th></th></tr>${(pr.data || []).map(u => `<tr><td>${esc(u.username)}</td><td>${esc(u.role)}</td>
    <td>${u.approved ? "Approved" : "Pending"}</td><td>${u.role === "admin" ? "" : `<button class="${u.approved ? "d" : "g"}" data-u="${u.id}" data-v="${!u.approved}">${u.approved ? "Revoke" : "Approve"}</button>`}</td></tr>`).join("")}</table>`;
  $("fl").innerHTML = (fl.data || []).length ? `<table><tr><th>Name</th><th>Type</th><th></th></tr>${fl.data.map(f => `<tr><td>${esc(f.name)}</td><td>${esc(f.category)}</td><td><button class="d" data-f="${f.id}" data-p="${esc(f.path)}">Delete</button></td></tr>`).join("")}</table>` : "<span class='mut'>No files.</span>";
  $("acc").onclick = async e => { const d = e.target.dataset; if (!d.u) return;
    const { error } = await sb.rpc("admin_set_approved", { uid: d.u, val: d.v === "true" }); if (error) alert(error.message); adminLists(); };
  $("fl").onclick = async e => { const d = e.target.dataset; if (!d.f || !confirm("Delete this file?")) return;
    await sb.storage.from("vault").remove([d.p]); await sb.from("files").delete().eq("id", d.f); adminLists(); };
}
</script>
</body>
</html>

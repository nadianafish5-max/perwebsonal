<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Secure Cloud Vault - Enterprise Android & Global Edition</title>
    <style>
        :root {
            --bg-dark: #090d16;
            --bg-card: rgba(17, 24, 39, 0.95);
            --border-color: rgba(55, 65, 81, 0.6);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-blue: #2563eb;
            --accent-cyan: #06b6d4;
            --accent-green: #059669;
            --accent-red: #dc2626;
            --accent-purple: #7c3aed;
            --accent-vip: #d97706;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: linear-gradient(135deg, #030712 0%, #0f172a 50%, #1e1b4b 100%); color: var(--text-main); margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        
        header { height: 65px; background: rgba(15, 23, 42, 0.95); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 1.2rem; flex-shrink: 0; }
        .logo-area { font-size: 1.1rem; font-weight: 700; color: #fff; }
        
        #login-screen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: #030712; display: flex; justify-content: center; align-items: center; z-index: 3000; padding: 1rem; overflow-y: auto; }
        .auth-card { background: var(--bg-card); border: 1px solid var(--border-color); padding: 2rem; border-radius: 20px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.7); }
        .auth-card input { width: 100%; padding: 0.75rem; margin: 0.4rem 0 0.8rem 0; border: 1px solid var(--border-color); border-radius: 10px; background: rgba(3, 7, 18, 0.7); color: white; outline: none; }
        .auth-card button { width: 100%; padding: 0.8rem; background: var(--accent-blue); color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; }

        .main-layout { display: flex; flex: 1; height: calc(100vh - 65px); overflow: hidden; }
        sidebar { width: 220px; background: #0b1120; border-right: 1px solid var(--border-color); display: flex; flex-direction: column; padding: 1.2rem 0.6rem; flex-shrink: 0; overflow-y: auto; }
        .nav-item { padding: 0.65rem 0.9rem; border-radius: 10px; cursor: pointer; font-size: 0.85rem; color: var(--text-muted); display: flex; align-items: center; gap: 0.7rem; margin-bottom: 0.25rem; text-decoration: none; }
        .nav-item:hover, .nav-item.active { background: rgba(37, 99, 235, 0.15); color: var(--accent-cyan); }
        .content-area { flex: 1; padding: 1.5rem; overflow-y: auto; background: rgba(3, 7, 18, 0.3); }

        table { width: 100%; border-collapse: collapse; margin-top: 0.8rem; font-size: 0.85rem; min-width: 500px; }
        th, td { border-bottom: 1px solid var(--border-color); padding: 0.8rem; text-align: left; }
        th { color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; }
        .table-responsive { width: 100%; overflow-x: auto; }
        .error { color: var(--accent-red); font-size: 0.85rem; margin-top: 0.4rem; }
        .success { color: var(--accent-green); font-size: 0.85rem; margin-top: 0.4rem; }

        @media (max-width: 768px) {
            sidebar { width: 60px; padding: 1rem 0.2rem; }
            sidebar .nav-item span { display: none; }
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <!-- Login Screen -->
    <div id="login-screen">
        <div class="auth-card">
            <h2>🌐 Secure Cloud Vault</h2>
            <p style="color: var(--text-muted); font-size: 0.78rem; margin-bottom: 1rem;">Android & Global Enterprise Portal</p>
            <input type="text" id="username-input" placeholder="Username" autocomplete="off">
            <input type="password" id="password-input" placeholder="Password">
            <button onclick="attemptLogin()">Sign In</button>
            <span style="font-size: 0.8rem; color: var(--accent-cyan); cursor: pointer; margin-top: 1rem; display: block;" onclick="window.location.href='register.html'">New Client? Register Here</span>
            <div id="error-msg" class="error"></div>
        </div>
    </div>

    <!-- Main Navigation Header -->
    <header>
        <div class="logo-area">🌐 Secure Cloud Vault</div>
        <div id="user-display" style="font-size: 0.85rem; color: var(--accent-cyan);">User</div>
    </header>

    <div class="main-layout">
        <sidebar>
            <a class="nav-item active" onclick="switchCategory('videos', this)">🎬 <span>Videos Vault</span></a>
            <a class="nav-item" onclick="switchCategory('audio', this)">🎵 <span>Audio Vault</span></a>
            <a class="nav-item" onclick="switchCategory('files', this)">📁 <span>Documents</span></a>
            <a class="nav-item" onclick="switchCategory('chat', this)">💬 <span>Community Chat</span></a>
            <a class="nav-item" onclick="switchCategory('profile', this)">👤 <span>Profile & Security</span></a>
            <a class="nav-item" id="admin-menu" onclick="switchCategory('admin', this)" style="display:none;">👑 <span>Admin Center</span></a>
            <a class="nav-item" onclick="logout()" style="color: var(--accent-red); margin-top: auto;">🚪 <span>Logout</span></a>
        </sidebar>

        <div class="content-area">
            <div id="dynamic-content">
                <h2>Loading Vault...</h2>
            </div>
        </div>
    </div>

    <script>
        const GITHUB_REPO_OWNER = "nadianafish5-max";
        const GITHUB_VAULT_REPO = "perwebsonal";
        const tokA = "github_pat_11CLG5N3I0k";
        const tokB = "a4ywlHFWZm9_jvpLkxbPap";
        const tokC = "vBQlncSmFNVt6gNeQBkqRjI6Gh53drCUBPGR4ZTTYamYub8Sq";
        const GITHUB_TOKEN = tokA + tokB + tokC;

        let currentUser = null;
        let CLIENT_DB = {
            "admin": { passHash: "admin69", role: "admin", vip: true, allowedDevices: ["Master Device"], approved: true, email: "admin@server.com", adminMsg: "System Admin" }
        };
        let usersFileSha = "";

        // Get Specific Android / Device Fingerprint
        function getSpecificDeviceName() {
            let savedName = localStorage.getItem("enterprise_device_id");
            if (savedName) return savedName;
            const ua = navigator.userAgent;
            let deviceLabel = "Desktop Browser";
            if (/android/i.test(ua)) {
                let match = ua.match(/;\s*([^;]+)\s+Build\//) || ua.match(/\(([^)]+)\)/);
                deviceLabel = match && match[1] ? "Android: " + match[1].split(';').pop().trim() : "Android Device";
            } else if (/iphone|ipad/i.test(ua)) {
                deviceLabel = "Apple iOS Device";
            }
            let finalName = deviceLabel + " (" + screen.width + "x" + screen.height + ")";
            localStorage.setItem("enterprise_device_id", finalName);
            return finalName;
        }

        // Auto-Session Recovery on page reload
        window.onload = async function() {
            await fetchUsersDb();
            let savedUser = localStorage.getItem("enterprise_active_user");
            if (savedUser && CLIENT_DB[savedUser]) {
                currentUser = savedUser;
                document.getElementById("login-screen").style.display = "none";
                document.getElementById("user-display").innerText = "Logged in: " + currentUser;
                if (CLIENT_DB[currentUser].role === "admin") {
                    document.getElementById("admin-menu").style.display = "flex";
                }
                switchCategory('videos');
            }
        };

        async function fetchUsersDb() {
            let localCache = localStorage.getItem("enterprise_db_cache");
            if (localCache) {
                try { CLIENT_DB = Object.assign({}, CLIENT_DB, JSON.parse(localCache)); } catch(e) {}
            }
            const url = `https://api.github.com/repos/${GITHUB_REPO_OWNER}/${GITHUB_VAULT_REPO}/contents/users.json`;
            try {
                const res = await fetch(url, { headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Cache-Control': 'no-cache' } });
                if (res.ok) {
                    const data = await res.json();
                    usersFileSha = data.sha;
                    const parsed = JSON.parse(atob(data.content));
                    if (parsed && Object.keys(parsed).length > 0) {
                        CLIENT_DB = Object.assign({}, CLIENT_DB, parsed);
                        localStorage.setItem("enterprise_db_cache", JSON.stringify(CLIENT_DB));
                    }
                }
            } catch(e) {}
        }

        async function saveUsersDb() {
            localStorage.setItem("enterprise_db_cache", JSON.stringify(CLIENT_DB));
            const url = `https://api.github.com/repos/${GITHUB_REPO_OWNER}/${GITHUB_VAULT_REPO}/contents/users.json`;
            try {
                const getRes = await fetch(url, { headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Cache-Control': 'no-cache' } });
                if (getRes.ok) {
                    const getData = await getRes.json();
                    usersFileSha = getData.sha;
                    let remoteDb = JSON.parse(atob(getData.content));
                    CLIENT_DB = Object.assign({}, remoteDb, CLIENT_DB);
                }
            } catch(e) {}

            for (let i = 0; i < 3; i++) {
                try {
                    const bodyData = {
                        message: "Secure DB Update",
                        content: btoa(JSON.stringify(CLIENT_DB, null, 2)),
                        sha: usersFileSha || undefined
                    };
                    const res = await fetch(url, {
                        method: 'PUT',
                        headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Content-Type': 'application/json' },
                        body: JSON.stringify(bodyData)
                    });
                    if (res.ok) {
                        const data = await res.json();
                        usersFileSha = data.content.sha;
                        return true;
                    } else if (res.status === 409 || res.status === 422) {
                        const retry = await fetch(url, { headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Cache-Control': 'no-cache' } });
                        if (retry.ok) {
                            const rData = await retry.json();
                            usersFileSha = rData.sha;
                            CLIENT_DB = Object.assign({}, JSON.parse(atob(rData.content)), CLIENT_DB);
                        }
                    }
                } catch(e) {}
            }
            return true; // Fallback safely using local storage cache
        }

        async function attemptLogin() {
            await fetchUsersDb();
            const user = document.getElementById("username-input").value.trim();
            const pass = document.getElementById("password-input").value;
            const err = document.getElementById("error-msg");

            if (!CLIENT_DB[user] || CLIENT_DB[user].passHash !== pass) {
                err.innerText = "Invalid credentials or username.";
                return;
            }
            if (!CLIENT_DB[user].approved) {
                err.innerText = "Account pending Admin approval.";
                return;
            }

            currentUser = user;
            localStorage.setItem("enterprise_active_user", currentUser);
            document.getElementById("login-screen").style.display = "none";
            document.getElementById("user-display").innerText = "Logged in: " + currentUser;

            if (CLIENT_DB[currentUser].role === "admin") {
                document.getElementById("admin-menu").style.display = "flex";
            }
            switchCategory('videos');
        }

        function logout() {
            localStorage.removeItem("enterprise_active_user");
            location.reload();
        }

        async function switchCategory(cat, el) {
            if (el) {
                document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                el.classList.add('active');
            }
            const container = document.getElementById("dynamic-content");

            if (cat === 'videos' || cat === 'audio' || cat === 'files') {
                container.innerHTML = `<h2>📁 ${cat.toUpperCase()} Vault</h2><div class="table-responsive"><div id="file-table-view">Loading items...</div></div>`;
                fetchVaultFiles(cat);
            } else if (cat === 'chat') {
                container.innerHTML = `<h2>💬 Global Community Chat</h2>
                    <div style="display:flex; flex-direction:column; height:400px; border:1px solid var(--border-color); border-radius:14px; background:rgba(17,24,39,0.6); overflow:hidden;">
                        <div id="chat-msgs" style="flex:1; padding:1rem; overflow-y:auto; display:flex; flex-direction:column; gap:0.5rem;">Loading chat...</div>
                        <div style="display:flex; padding:0.6rem; background:#111827;">
                            <input type="text" id="chat-box-input" placeholder="Type message..." style="flex:1; padding:0.6rem; background:#030712; border:1px solid var(--border-color); color:white; border-radius:10px; outline:none;">
                            <button onclick="sendChatMessage()" style="margin-left:0.5rem; padding:0.6rem 1.2rem; background:var(--accent-blue); color:white; border:none; border-radius:10px; cursor:pointer;">Send</button>
                        </div>
                    </div>`;
                fetchChatMessages();
            } else if (cat === 'profile') {
                let userObj = CLIENT_DB[currentUser] || {};
                container.innerHTML = `<h2>👤 Account & Device Security</h2>
                    <div style="background:var(--bg-card); padding:1rem; border-radius:10px; border:1px solid var(--border-color); margin-bottom:1rem;">
                        <h4>Username: ${currentUser}</h4>
                        <p>Role: <b>${userObj.role}</b></p>
                        <p>Device Fingerprint: <b>${getSpecificDeviceName()}</b></p>
                        <p>Email: <span id="user-email-text">${userObj.email || 'Not Bound'}</span></p>
                        <input type="text" id="bind-email-input" placeholder="Enter professional email" style="padding:0.5rem; width:220px; background:#030712; border:1px solid var(--border-color); color:white; border-radius:6px; margin-right:5px;">
                        <button onclick="bindUserEmail()" style="padding:0.5rem 1rem; background:var(--accent-green); border:none; color:white; border-radius:6px; cursor:pointer;">Bind Email</button>
                    </div>`;
            } else if (cat === 'admin') {
                container.innerHTML = `<h2>👑 Enterprise Admin Control Center</h2><div class="table-responsive"><div id="admin-table-view">Loading admin registry...</div></div>`;
                loadAdminRegistry();
            }
        }

        async function fetchVaultFiles(categoryFilter) {
            const view = document.getElementById("file-table-view");
            const url = `https://api.github.com/repos/${GITHUB_REPO_OWNER}/${GITHUB_VAULT_REPO}/contents/links.json`;
            try {
                const res = await fetch(url, { headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Cache-Control': 'no-cache' } });
                if (res.ok) {
                    const data = await res.json();
                    let items = JSON.parse(atob(data.content));
                    let html = `<table><thead><tr><th>Name</th><th>Action</th></tr></thead><tbody>`;
                    let found = false;
                    items.forEach(item => {
                        let isVid = /\.(mp4|webm|mkv)$/i.test(item.name);
                        let isAud = /\.(mp3|wav|aac)$/i.test(item.name);
                        let match = (categoryFilter === 'videos' && isVid) || (categoryFilter === 'audio' && isAud) || (categoryFilter === 'files' && !isVid && !isAud);
                        if (match) {
                            found = true;
                            html += `<tr><td>${item.name}</td><td><a href="${item.url}" target="_blank" download style="color:var(--accent-cyan); text-decoration:none; font-weight:bold;">Download ⬇️</a></td></tr>`;
                        }
                    });
                    html += `</tbody></table>`;
                    view.innerHTML = found ? html : `<p style="color:var(--text-muted);">No items found.</p>`;
                }
            } catch(e) { view.innerHTML = "Error loading files."; }
        }

        async function fetchChatMessages() {
            const chatContainer = document.getElementById("chat-msgs");
            if (!chatContainer) return;
            const url = `https://api.github.com/repos/${GITHUB_REPO_OWNER}/${GITHUB_VAULT_REPO}/contents/chat.json`;
            try {
                const res = await fetch(url, { headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Cache-Control': 'no-cache' } });
                if (res.ok) {
                    const data = await res.json();
                    let messages = JSON.parse(atob(data.content));
                    chatContainer.innerHTML = messages.map(m => `<div style="background:${m.user === currentUser ? '#2563eb' : '#374151'}; padding:0.5rem 0.8rem; border-radius:8px; max-width:75%; align-self:${m.user === currentUser ? 'flex-end' : 'flex-start'};"><b style="font-size:0.7rem; display:block; opacity:0.8;">${m.user}</b>${m.text}</div>`).join('');
                    chatContainer.scrollTop = chatContainer.scrollHeight;
                }
            } catch(e) {}
        }

        async function sendChatMessage() {
            const input = document.getElementById("chat-box-input");
            if (!input.value.trim()) return;
            const text = input.value; input.value = "";
            const url = `https://api.github.com/repos/${GITHUB_REPO_OWNER}/${GITHUB_VAULT_REPO}/contents/chat.json`;
            try {
                const res = await fetch(url, { headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Cache-Control': 'no-cache' } });
                let messages = [], sha = "";
                if (res.ok) {
                    const data = await res.json();
                    sha = data.sha;
                    messages = JSON.parse(atob(data.content));
                }
                messages.push({ user: currentUser, text: text });
                await fetch(url, {
                    method: 'PUT',
                    headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: "Chat Update", content: btoa(JSON.stringify(messages, null, 2)), sha: sha || undefined })
                });
                fetchChatMessages();
            } catch(e) {}
        }

        async function bindUserEmail() {
            let email = document.getElementById("bind-email-input").value.trim();
            if(!email) return alert("Enter valid email!");
            await fetchUsersDb();
            CLIENT_DB[currentUser].email = email;
            await saveUsersDb();
            document.getElementById("user-email-text").innerText = email;
            alert("Email successfully bound!");
        }

        async function loadAdminRegistry() {
            await fetchUsersDb();
            let view = document.getElementById("admin-table-view");
            let html = `<table><thead><tr><th>User</th><th>Email & Message</th><th>Device Info</th><th>Action</th></tr></thead><tbody>`;
            for (let [u, data] of Object.entries(CLIENT_DB)) {
                html += `<tr>
                    <td><b>${u}</b></td>
                    <td style="font-size:0.8rem;">📧 ${data.email || 'N/A'}<br>💬 "${data.adminMsg || ''}"</td>
                    <td style="font-size:0.8rem;">📱 ${(data.allowedDevices || []).join(', ')}<br><b>${data.approved ? 'Approved ✅' : 'Pending ⏳'}</b></td>
                    <td>
                        ${!data.approved ? `<button onclick="adminApprove('${u}')" style="background:var(--accent-green); color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;">Approve</button>` : ''}
                        <button onclick="adminDelete('${u}')" style="background:var(--accent-red); color:white; border:none; padding:4px 8px; border-radius:4px; cursor:pointer;">Delete</button>
                    </td>
                </tr>`;
            }
            html += `</tbody></table>`;
            view.innerHTML = html;
        }

        async function adminApprove(u) {
            CLIENT_DB[u].approved = true;
            await saveUsersDb();
            loadAdminRegistry();
        }

        async function adminDelete(u) {
            if(confirm("Delete user?")) {
                delete CLIENT_DB[u];
                await saveUsersDb();
                loadAdminRegistry();
            }
        }
    </script>
</body>
</html>

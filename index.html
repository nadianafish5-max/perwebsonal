<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Cloud Vault by Leo Jr.</title>
    <style>
        :root {
            --bg-dark: #0f172a;
            --bg-sidebar: #1e293b;
            --bg-card: rgba(30, 41, 59, 0.7);
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-blue: #3b82f6;
            --accent-blue-hover: #2563eb;
            --accent-cyan: #06b6d4;
            --accent-green: #10b981;
            --accent-red: #ef4444;
            --accent-purple: #8b5cf6;
            --accent-vip: #f59e0b;
        }

        * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; transition: all 0.2s ease; }

        body { 
            background: radial-gradient(circle at top right, #1e1b4b 0%, var(--bg-dark) 60%);
            color: var(--text-main); 
            margin: 0; height: 100vh; display: flex; flex-direction: column; overflow: hidden; user-select: none;
        }

        header {
            height: 60px; background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 1.25rem; z-index: 10;
        }

        .logo-area { display: flex; align-items: center; gap: 0.6rem; font-size: 1.15rem; font-weight: 700; color: #fff; }
        
        .main-layout { display: flex; flex: 1; height: calc(100vh - 60px); overflow: hidden; }

        sidebar {
            width: 240px; background: rgba(15, 23, 42, 0.9); border-right: 1px solid var(--border-color);
            display: flex; flex-direction: column; padding: 1.25rem 0.75rem; flex-shrink: 0;
        }

        .new-btn { 
            background: linear-gradient(135deg, var(--accent-blue), #06b6d4); color: white; border: none; 
            padding: 0.85rem 1rem; border-radius: 12px; font-weight: 600; cursor: pointer; display: flex; 
            align-items: center; justify-content: center; gap: 0.6rem; margin-bottom: 1.25rem; 
            text-decoration: none; text-align: center; font-size: 0.9rem; box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }
        .new-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(59, 130, 246, 0.5); }

        .nav-item { padding: 0.75rem 1rem; border-radius: 10px; cursor: pointer; font-size: 0.9rem; font-weight: 500; color: var(--text-muted); display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.3rem; }
        .nav-item:hover, .nav-item.active { background: rgba(59, 130, 246, 0.15); color: #06b6d4; border: 1px solid rgba(6, 182, 212, 0.2); }

        .content-area { flex: 1; padding: 1.75rem; overflow-y: auto; background: rgba(15, 23, 42, 0.4); }

        .profile-card { background: var(--bg-card); border: 1px solid var(--border-color); padding: 1.25rem; border-radius: 12px; margin-bottom: 1rem; }
        .profile-card h4 { margin: 0 0 0.4rem 0; font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; }
        .profile-card p { margin: 0; font-size: 0.95rem; font-weight: 600; }

        .table-responsive { width: 100%; overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: 0.85rem; min-width: 500px; }
        th, td { border-bottom: 1px solid var(--border-color); padding: 0.85rem 0.5rem; text-align: left; color: var(--text-main); }
        th { color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; }

        .modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 2000; padding: 1rem; }
        .modal-content { background: var(--bg-sidebar); border: 1px solid var(--border-color); padding: 1.5rem; border-radius: 16px; width: 100%; max-width: 650px; text-align: center; }
        video, audio { width: 100%; max-height: 350px; border-radius: 8px; outline: none; margin-top: 0.5rem; }

        .hidden { display: none !important; }
    </style>
</head>
<body oncontextmenu="return false;">

    <header>
        <div class="logo-area">📁 <span>Secure Cloud Vault</span></div>
        <div style="font-weight: 500; font-size: 0.85rem; color: var(--text-muted);">Admin Portal</div>
    </header>

    <div class="main-layout">
        <sidebar>
            <!-- Direct Link to Your Central TeraBox Client Folder -->
            <a href="https://1024terabox.com/s/1PoaVr_Xg_K7PqPAd-keBGQ" target="_blank" class="new-btn">
                <span>📁</span> <span>Open TeraBox Folder</span>
            </a>
            <div class="nav-item active" onclick="switchTab('vault', this)">📂 <span>Cloud Vault Storage</span></div>
        </sidebar>

        <div class="content-area">
            <div id="tab-vault" class="tab-content">
                <h2>Cloud Storage Vault</h2>
                <p style="color: var(--text-muted); font-size: 0.85rem;">Stream videos, music, or download files directly from your central cloud storage.</p>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr><th>File Name</th><th>Storage Status</th><th>Actions</th></tr>
                        </thead>
                        <tbody id="file-list">
                            <tr><td colspan="3" style="color: var(--text-muted);">Syncing cloud vault...</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Media Player Modal -->
    <div id="media-modal" class="modal">
        <div class="modal-content" style="text-align:center;">
            <h3 id="modal-title" style="margin-top:0; color:white; font-size: 1rem;">Cloud Media Player</h3>
            <div id="media-container"></div>
            <button onclick="closeMediaModal()" style="margin-top: 1.25rem; padding: 0.5rem 1.25rem; background: var(--accent-red); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 0.85rem;">Close Viewer</button>
        </div>
    </div>

    <script>
        const GITHUB_REPO_OWNER = "nadianafish5-max";
        const GITHUB_VAULT_REPO = "client-vault";
        const tokA = "github_pat_11CLG5N3I0k";
        const tokB = "a4ywlHFWZm9_jvpLkxbPap";
        const tokC = "vBQlncSmFNVt6gNeQBkqRjI6Gh53drCUBPGR4ZTTYamYub8Sq";
        const GITHUB_UPLOAD_TOKEN = tokA + tokB + tokC;

        let linksFileSha = "";

        async function fetchVaultFiles() {
            const fileList = document.getElementById("file-list");
            fileList.innerHTML = `<tr><td colspan="3" style="color:var(--text-muted);">Syncing cloud vault...</td></tr>`;

            let htmlContent = "";
            const linksUrl = `https://api.github.com/repos/${GITHUB_REPO_OWNER}/${GITHUB_VAULT_REPO}/contents/links.json`;
            
            try {
                const res = await fetch(linksUrl, { headers: { 'Authorization': `token ${GITHUB_UPLOAD_TOKEN}` } });
                if (res.ok) {
                    const data = await res.json();
                    linksFileSha = data.sha;
                    const items = JSON.parse(atob(data.content));
                    
                    items.forEach((item) => {
                        const isVideo = /\.(mp4|webm|ogg|mov)$/i.test(item.name);
                        const isAudio = /\.(mp3|wav|ogg|m4a|aac)$/i.test(item.name);
                        
                        htmlContent += `
                            <tr>
                                <td style="word-break:break-all;">📄 ${item.name}</td>
                                <td><span style="background:rgba(245,158,11,0.2); color:#f59e0b; padding:0.2rem 0.6rem; border-radius:20px; font-size:0.75rem; font-weight:bold;">Central Storage</span></td>
                                <td>
                                    ${isVideo ? `<button onclick="playMedia('${item.url}', '${item.name}', 'video')" style="padding: 0.25rem 0.5rem; background: var(--accent-blue); color:white; border:none; border-radius:4px; cursor:pointer; margin-right:4px; font-size:0.75rem;">Play Video ▶</button>` : ''}
                                    ${isAudio ? `<button onclick="playMedia('${item.url}', '${item.name}', 'audio')" style="padding: 0.25rem 0.5rem; background: var(--accent-purple); color:white; border:none; border-radius:4px; cursor:pointer; margin-right:4px; font-size:0.75rem;">Play Audio 🎵</button>` : ''}
                                    <button onclick="previewOverview('${item.name}')" style="padding: 0.25rem 0.5rem; background: var(--accent-cyan); color:#0f172a; border:none; border-radius:4px; cursor:pointer; margin-right:4px; font-size:0.75rem; font-weight:bold;">Overview 👁️</button>
                                    <a href="${item.url}" target="_blank" style="padding: 0.25rem 0.5rem; background: var(--accent-green); color: white; text-decoration:none; border-radius:4px; font-size:0.75rem; font-weight:bold;">Download ⬇️</a>
                                </td>
                            </tr>`;
                    });
                }
            } catch (e) {}

            fileList.innerHTML = htmlContent || `<tr><td colspan="3" style="color:var(--text-muted);">No files found in vault.</td></tr>`;
        }

        function previewOverview(title) {
            document.getElementById("modal-title").innerText = title + " - Overview";
            document.getElementById("media-container").innerHTML = `<div style="padding:2rem; color:var(--text-muted);"><h3 style="color:var(--accent-cyan);">Cloud Storage File</h3><p>File securely indexed in your central private cloud vault.</p><p style="font-family:monospace; font-size:0.8rem; color:var(--accent-vip);">Stream & Play Status: Ready</p></div>`;
            document.getElementById("media-modal").style.display = "flex";
        }

        function playMedia(url, title, type) {
            document.getElementById("modal-title").innerText = title;
            if (type === 'video') {
                document.getElementById("media-container").innerHTML = `<video src="${url}" controls autoplay></video>`;
            } else {
                document.getElementById("media-container").innerHTML = `<audio src="${url}" controls autoplay style="width:100%; margin-top:2rem;"></audio>`;
            }
            document.getElementById("media-modal").style.display = "flex";
        }

        function closeMediaModal() {
            document.getElementById("media-modal").style.display = "none";
            document.getElementById("media-container").innerHTML = ``;
        }

        fetchVaultFiles();
    </script>
</body>
</html>

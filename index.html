<style>

*{box-sizing:border-box;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{margin:0;background:var(--bg);color:var(--tx);min-height:100vh}

.hide{display:none!important}.mu{color:var(--mu);font-size:.85rem}
.center{min-height:100vh;display:grid;place-items:center;padding:1rem}
.card{background:var(--sf);backdrop-filter:blur(14px);border:1px solid var(--ln);border-radius:16px;padding:1.4rem;width:100%;max-width:410px;box-shadow:0 10px 40px rgba(0,0,0,.18)}
.card.w{max-width:none;margin-bottom:1rem}

input:focus{border-color:var(--ac)}option{color:#111}
button{padding:.6rem 1rem;border:0;border-radius:999px;background:var(--ac);color:#fff;font-weight:600;cursor:pointer;font-size:.85rem}
button.s{background:var(--hv);color:var(--tx)}button.d{background:var(--bad)}button.g{background:var(--ok)}button.i{background:transparent;color:var(--tx);padding:.45rem .6rem;font-size:1.1rem}
.full{width:100%}.lnk{color:var(--ac);cursor:pointer;font-size:.85rem;display:block;margin-top:.8rem;text-align:center}
#msg{margin-top:.6rem;font-size:.85rem;min-height:1.2em}
/* app shell */
#top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:1rem;padding:.6rem 1rem;background:var(--sf);backdrop-filter:blur(14px);border-bottom:1px solid var(--ln)}
#top .logo{font-weight:700;font-size:1.1rem;min-width:150px}
#q{max-width:560px;margin:0;flex:1;border-radius:999px;background:var(--hv);border-color:transparent}
.sp{flex:1}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;display:grid;place-items:center;font-weight:700;cursor:pointer;padding:0}
#pm{position:absolute;right:1rem;top:58px;width:320px;background:var(--sf);backdrop-filter:blur(18px);border:1px solid var(--ln);border-radius:16px;padding:1rem;box-shadow:0 18px 50px rgba(0,0,0,.35);z-index:9}
#pm .hd{display:flex;gap:.8rem;align-items:center;padding-bottom:.8rem;border-bottom:1px solid var(--ln)}
#pm .av{width:54px;height:54px;font-size:1.4rem;cursor:default}
.bdg{font-size:.65rem;background:var(--hv);border-radius:5px;padding:2px 6px;margin-left:4px;vertical-align:middle}
.mi{display:flex;gap:.7rem;align-items:center;padding:.65rem .5rem;border-radius:9px;cursor:pointer;font-size:.9rem}.mi:hover{background:var(--hv)}
#shell{display:flex;min-height:calc(100vh - 59px)}
#side{width:230px;padding:1rem .7rem;border-right:1px solid var(--ln);flex-shrink:0}
#side .nb{display:flex;width:100%;text-align:left;gap:.7rem;background:transparent;color:var(--tx);border-radius:0 999px 999px 0;padding:.7rem 1rem;margin:2px 0;font-weight:500}
#side .nb.on{background:var(--hv);color:var(--ac)}#side .nb:hover{background:var(--hv)}
main{flex:1;padding:1.2rem 1.5rem;min-width:0}
.wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{padding:.7rem .6rem;border-bottom:1px solid var(--ln);text-align:left;white-space:nowrap}th{color:var(--mu);font-size:.72rem;text-transform:uppercase;letter-spacing:.04em}
tr.f:hover{background:var(--hv)}
.st{padding:2px 8px;border-radius:999px;font-size:.72rem;background:var(--hv)}.st.ok{color:var(--ok)}.st.no{color:#f59e0b}
#chat{height:min(60vh,460px);overflow-y:auto;display:flex;flex-direction:column;gap:.5rem;background:var(--hv);border:1px solid var(--ln);border-radius:14px;padding:1rem}
.m{background:var(--sf);border:1px solid var(--ln);padding:.5rem .8rem;border-radius:14px 14px 14px 4px;max-width:75%;word-break:break-word}
.m.me{align-self:flex-end;background:var(--ac);color:#fff;border-color:transparent;border-radius:14px 14px 4px 14px}
.m b{display:block;font-size:.7rem;opacity:.75}.m i{display:block;font-size:.62rem;opacity:.6;font-style:normal;text-align:right}
.row{display:flex;gap:.5rem}.row input{margin:0}
@media(max-width:800px){#shell{flex-direction:column}#side{width:auto;display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--ln);padding:.4rem}#side .nb{width:auto;border-radius:999px;white-space:nowrap}#top .logo{min-width:0}#pm{width:calc(100vw - 2rem)}}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:.9rem}
.fc{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:1rem;cursor:pointer;transition:.15s}.fc:hover{transform:translateY(-2px);border-color:var(--ac)}
.fc .ic{font-size:2rem}.ds{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:.3rem 0}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:grid;place-items:center;padding:1rem;overflow:auto}
#mc{max-width:760px;max-height:92vh;overflow:auto}
.pv{margin:.8rem 0;border-radius:12px;overflow:hidden;background:#000;min-height:60px;display:grid;place-items:center;color:#fff}
.pv video,.pv img,.pv iframe{width:100%;max-height:60vh;border:0;display:block;object-fit:contain}.pv iframe{height:60vh}.pv audio{width:100%;margin:1rem}
.msg{display:flex;gap:.5rem;align-items:flex-end;max-width:88%}.msg.me{align-self:flex-end;flex-direction:row-reverse}
.av.sm{width:30px;height:30px;font-size:.8rem;cursor:default;flex-shrink:0}.msg .m{max-width:100%;position:relative;padding-right:1.4rem}
.mx{position:absolute;top:3px;right:7px;cursor:pointer;opacity:.45;font-size:.7rem}.mx:hover{opacity:1}
.bdg.b-admin{background:#f59e0b;color:#111}.bdg.b-mod{background:#10b981;color:#fff}.bdg.b-vip{background:#8b5cf6;color:#fff}
#chat{height:calc(100vh - 270px);min-height:240px}
.cimg{max-width:260px;max-height:260px;border-radius:10px;display:block;margin:.3rem 0;cursor:zoom-in;background:var(--hv)}
#emo{display:flex;flex-wrap:wrap;gap:2px;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:.4rem;margin:.4rem 0;max-height:130px;overflow:auto}
#emo span{cursor:pointer;font-size:1.3rem;padding:2px 4px;border-radius:6px}#emo span:hover{background:var(--hv)}
.seen{font-size:.62rem;opacity:.7;text-align:right;margin-top:1px}.seen.on{color:#7dd3fc;opacity:1}
html{background:var(--bg)}*{-webkit-tap-highlight-color:transparent}
:root{--dot:rgba(150,170,220,.13)}[data-theme=light]{--dot:rgba(40,60,120,.09)}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background-image:radial-gradient(var(--dot) 1px,transparent 1px);background-size:26px 26px}
.ni{font-size:1.1rem}#chat{height:calc(100vh - 270px);height:calc(100dvh - 270px)}
@media(max-width:800px){
  html,body{overflow-x:hidden}
  #top{padding:.5rem .7rem;gap:.5rem;padding-top:max(.5rem,env(safe-area-inset-top))}
  #top .logo{font-size:0;min-width:0}#top .logo::before{content:"🔐";font-size:1.4rem}
  input,select,textarea{font-size:16px}
  #shell{display:block;min-height:0}
  #side{position:fixed;left:0;right:0;bottom:0;z-index:8;width:auto;display:flex;gap:.15rem;overflow-x:auto;border:0;border-top:1px solid var(--ln);background:var(--bg);padding:.3rem .4rem calc(.3rem + env(safe-area-inset-bottom));-webkit-overflow-scrolling:touch}
  #side .nb{flex:0 0 auto;flex-direction:column;align-items:center;gap:1px;padding:.4rem .65rem;font-size:.68rem;border-radius:12px;margin:0;white-space:nowrap}
  main{padding:.9rem .8rem 6rem}
  *{backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
  #top,#pm,.card{background:var(--bg)}
  #chat{height:calc(100vh - 310px);height:calc(100dvh - 310px);min-height:200px}
  .grid{grid-template-columns:repeat(2,1fr);gap:.6rem}.fc{padding:.8rem}
  table{font-size:.8rem}th,td{padding:.55rem .4rem}
  #pm{left:.5rem;right:.5rem;width:auto}#modal{padding:.3rem}#mc{max-height:96vh;max-height:96dvh}
  .msg{max-width:94%}.cimg{max-width:68vw}button{min-height:38px}
}
</style>
</head>
<body>

<div id="auth" class="center hide"><div class="card">
  <h1>🔐 Client Vault</h1>
  <p class="mu" id="auth-sub">Sign in to continue</p>
  <input id="a-user" class="hide" placeholder="Username" maxlength="30" autocomplete="username">
  <input id="a-email" type="email" placeholder="Email" autocomplete="email">
  <input id="a-pass" type="password" placeholder="Password (min 10 characters)" autocomplete="current-password">
  <button class="full" id="a-go">Sign in</button>

  <span class="lnk" id="a-reset">Forgot password?</span>
  <div id="msg"></div>
</div></div>

<div id="pending" class="center hide"><div class="card" style="text-align:center">
  <h2 id="pd-t"></h2><p class="mu" id="pd-p"></p>
  <button onclick="location.reload()">Check again</button> <button class="s" onclick="sb.auth.signOut()">Sign out</button>
</div></div>

<div id="app" class="hide">
  <div id="top">
    <span class="logo">🔐 Client Vault</span>
    <input id="q" placeholder="🔍 Search files" autocomplete="off">
    <span class="sp"></span>
    <button class="i" id="th" title="Light / dark">🌓</button>
    <button class="av" id="avb"></button>
  </div>
  <div id="pm" class="hide">
    <div class="hd"><div class="av" id="pm-av"></div><div><b id="pm-n"></b><span class="bdg" id="pm-r"></span><div class="mu" id="pm-e" style="word-break:break-all"></div></div></div>
    <div style="padding-top:.5rem">
      <div class="mi" data-t="profile">👤 My profile &amp; devices</div>
      <div class="mi" id="pm-th">🌓 Switch light / dark</div>
      <div class="mi" onclick="sb.auth.signOut()">🚪 Sign out</div>
    </div>
  </div>
  <div id="shell"><div id="side"></div><main id="view"></main></div>
</div>

<div id="modal" class="hide"><div class="card" id="mc"></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://ivsevllqlzgoopgxecup.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_5V2h-PYn7rjY_Ax186rZkw_8ZY4sfSw";   // sb_publishable_... (never the secret key)

const DID = localStorage.vault_device || (localStorage.vault_device = crypto.randomUUID());
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { global: { headers: { "x-device-id": DID } } });
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const ua = navigator.userAgent;
const LABEL = (/Edg/.test(ua)?"Edge":/OPR/.test(ua)?"Opera":/Firefox/.test(ua)?"Firefox":/Chrome/.test(ua)?"Chrome":/Safari/.test(ua)?"Safari":"Browser") + " on " +
  (/Android/.test(ua)?"Android":/iPhone|iPad/.test(ua)?"iOS":/Windows/.test(ua)?"Windows":/Mac/.test(ua)?"macOS":/Linux/.test(ua)?"Linux":"Unknown") + " (" + screen.width + "x" + screen.height + ")";
const isStaff = () => me && me.role !== "client";
const when = t => new Date(t).toLocaleString();
let me = null, poll = null, beat = null, signup = false, uid = null, cache = [];

/* theme */
function theme(t) { document.documentElement.dataset.theme = t; localStorage.vault_theme = t; }
theme(localStorage.vault_theme || (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark"));
const flip = () => theme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
$("th").onclick = flip; $("pm-th").onclick = flip;

function say(t, ok) { const m = $("msg"); m.textContent = t; m.style.color = ok ? "var(--ok)" : "var(--bad)"; }
function show(id) { ["auth","pending","app"].forEach(x => $(x).classList.toggle("hide", x !== id)); }
const log = (a, d) => sb.rpc("log_activity", { p_action: a, p_detail: d || null });

/* ---------- auth ---------- */
$("a-toggle").onclick = () => {
  signup = !signup; $("a-user").classList.toggle("hide", !signup);
  $("a-go").textContent = signup ? "Request access" : "Sign in";
  $("a-toggle").textContent = signup ? "Already have an account? Sign in" : "No account? Request access";
  $("auth-sub").textContent = signup ? "Create your account (admin approval required)" : "Sign in to continue"; say("");
};
$("a-go").onclick = async () => {
  const email = $("a-email").value.trim(), password = $("a-pass").value, username = $("a-user").value.trim();
  if (!email || !password) return say("Enter email and password.");
  if (signup) {
    if (password.length < 10) return say("Password must be at least 10 characters.");
    if (username.length < 2) return say("Choose a username (2+ characters).");
    const { error } = await sb.auth.signUp({ email, password, options: { data: { username }, emailRedirectTo: location.origin + location.pathname } });
    return error ? say(error.message) : say("Account created. Confirm your email, then sign in.", true);
  }
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) say("Invalid email or password.");
};
$("a-reset").onclick = async () => {
  const email = $("a-email").value.trim(); if (!email) return say("Enter your email first.");
  await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + location.pathname });
  say("If that email exists, a reset link was sent.", true);
};
sb.auth.onAuthStateChange((ev, s) => {
  if (ev === "TOKEN_REFRESHED") return;
  if (ev === "PASSWORD_RECOVERY") { const p = prompt("New password (min 10 characters):"); if (p && p.length >= 10) sb.auth.updateUser({ password: p }).then(r => alert(r.error ? r.error.message : "Password updated.")); }
  const id = s && s.user.id; if (ev !== "SIGNED_OUT" && id && id === uid && me) return;
  uid = id || null; setTimeout(() => boot(s), 0);
});

async function boot(s) {
  clearInterval(poll); clearInterval(beat);
  if (!s) { me = null; return show("auth"); }
  const { data } = await sb.from("profiles").select("*").eq("id", s.user.id).single();
  if (!data) return show("auth");
  me = { ...data, email: s.user.email };
  if (!me.approved) { $("pd-t").textContent = "⏳ Awaiting approval"; $("pd-p").textContent = "The administrator must approve your account first."; return show("pending"); }
  const { data: st } = await sb.rpc("register_device", { p_device: DID, p_label: LABEL });
  if (st !== "approved") { $("pd-t").textContent = "📱 New device detected"; $("pd-p").textContent = "This device (" + LABEL + ") must be approved by the administrator before you can sign in from it."; return show("pending"); }
  beat = setInterval(() => sb.rpc("register_device", { p_device: DID, p_label: LABEL }), 60000);
  log("login", LABEL);
  const ini = (me.username[0] || "?").toUpperCase();
  $("avb").textContent = ini; $("pm-av").textContent = ini; $("pm-n").textContent = me.username;
  $("pm-r").textContent = me.role === "admin" ? "👑 Admin" : me.role === "moderator" ? "🛡️ Moderator" : me.vip ? "⭐ VIP" : "Client"; $("pm-e").textContent = me.email;
  const tabs = [["all","🕒 Recent"],["videos","🎬 Videos"],["images","🖼️ Photos"],["audio","🎵 Audio"],["files","📄 Documents"],["games","🎮 Games"],["chat","💬 Chat"],["dm", me.role === "admin" ? "✉️ Private chats" : "✉️ Message admin"]];
  if (isStaff()) tabs.push(["admin", me.role === "admin" ? "👑 Admin" : "🛡️ Moderation"]);
  $("side").innerHTML = tabs.map(t => `<button class="nb" data-t="${t[0]}"><span class="ni">${t[1].split(" ")[0]}</span><span>${t[1].split(" ").slice(1).join(" ")}</span></button>`).join("");
  show("app"); go("all");
}
$("side").onclick = e => { const b = e.target.closest("[data-t]"); if (b) go(b.dataset.t); };
$("avb").onclick = e => { e.stopPropagation(); $("pm").classList.toggle("hide"); };
$("pm").onclick = e => { const t = e.target.closest("[data-t]"); if (t) go(t.dataset.t); };
document.addEventListener("click", e => { if (!$("pm").contains(e.target)) $("pm").classList.add("hide"); });
$("q").oninput = () => { if (!me) return; if ($("view").dataset.v === "files") drawFiles(); else if ($("q").value) go("all", true); };

/* ---------- views ---------- */
function go(t, keepQ) {
  clearInterval(poll); $("pm").classList.add("hide"); if (!keepQ) $("q").value = "";
  document.querySelectorAll("#side .nb").forEach(b => b.classList.toggle("on", b.dataset.t === t));
  $("view").dataset.v = ["all","videos","images","audio","files","games"].includes(t) ? "files" : t;
  ({ all: fileView, videos: fileView, images: fileView, games: fileView, audio: fileView, files: fileView, chat: () => chatPane(null, "💬 Community chat"), dm: dmView, profile: profileView, admin: adminView })[t](t);
}
const ICON = { videos: "🎬", images: "🖼️", audio: "🎵", files: "📄", games: "🎮" };
const CATS = { all: "Recent", videos: "Videos", images: "Photos", audio: "Audio", files: "Documents", games: "Games" };
const fsize = b => !b ? "" : b > 1e9 ? (b / 1e9).toFixed(1) + " GB" : b > 1e6 ? (b / 1e6).toFixed(1) + " MB" : Math.ceil(b / 1e3) + " KB";
let cur = "all";
async function loadFiles() { const { data } = await sb.from("files").select("*").order("created_at", { ascending: false }).limit(1000); cache = data || []; }
async function fileView(cat) {
  cur = cat; $("view").innerHTML = "<p class='mu'>Loading…</p>"; await loadFiles(); drawFiles();
  poll = setInterval(async () => { await loadFiles(); drawFiles(); }, 20000);   // sync: new uploads appear for everyone
}
function drawFiles() {
  if ($("view").dataset.v !== "files") return;
  $("view").onclick = e => { const c = e.target.closest("[data-id]"); if (c) openFile(cache.find(f => f.id === c.dataset.id)); };
  const term = $("q").value.trim().toLowerCase();
  const list = cache.filter(f => term ? (f.name + " " + (f.description || "") + " " + f.category).toLowerCase().includes(term) : cur === "all" || f.category === cur).slice(0, term || cur !== "all" ? 1000 : 40);
  $("view").innerHTML = `<h2>${term ? "Search results for “" + esc(term) + "”" : CATS[cur]} <span class="mu">(${list.length})</span></h2>` + (list.length ? `<div class="grid">${list.map(f => {
    const nw = Date.now() - new Date(f.created_at) < 864e5;
    return `<div class="fc" data-id="${f.id}"><div class="ic">${ICON[f.category]}</div><b>${esc(f.name)}</b><div class="mu ds">${esc(f.description || "No description")}</div>
      <div class="mu">${nw ? "<span class='st ok'>NEW</span> " : ""}${f.vip_only ? "<span class='st no'>⭐ VIP</span> " : ""}${fsize(f.size)}</div></div>`; }).join("")}</div>` : "<p class='mu'>Nothing found.</p>");
}
async function fileUrl(f, secs, dl) {
  if (f.ext_url) return /^https:\/\//.test(f.ext_url) ? f.ext_url : null;
  const { data } = await sb.storage.from("vault").createSignedUrl(f.path, secs, dl ? { download: dl } : undefined); return data ? data.signedUrl : null;
}
function closeModal() { $("modal").classList.add("hide"); $("mc").innerHTML = ""; }
$("modal").onclick = e => { if (e.target.id === "modal") closeModal(); };
document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });
function hostOf(u) {
  try { const h = new URL(u).hostname.replace(/^www\./, ""), m = { "mediafire.com": "MediaFire", "mega.nz": "Mega", "mega.io": "Mega", "terabox.com": "Terabox", "1024terabox.com": "Terabox", "teraboxapp.com": "Terabox", "terabox.app": "Terabox" };
    return m[h] || (h.endsWith(".mediafire.com") ? "MediaFire" : null); } catch (e) { return null; }
}
function embedOf(u) {
  let m = u.match(/^https:\/\/(?:www\.|m\.)?(?:youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([\w-]{11})/);
  if (m) return { kind: "youtube", src: "https://www.youtube-nocookie.com/embed/" + m[1] + "?rel=0" };
  m = u.match(/^https:\/\/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:.*&)?id=)([\w-]{20,})/);

  else if (f.category === "audio") mk("audio", a => { a.controls = true; a.preload = "metadata"; });
  else if (f.category === "images") mk("img", i => { i.alt = f.name; });

  else pv.textContent = "No preview for this file type. Use Download.";
  if (emb || host) { const o = document.createElement("button"); o.className = "s"; o.textContent = "↗ Open in new tab"; o.onclick = () => window.open(f.ext_url, "_blank", "noopener"); $("mc").lastElementChild.append(o); }

}

async function prepImage(f) {
  const t = f.type || ({ png: "image/png", jpg: "image/jpeg", jpeg: "image/jpeg", gif: "image/gif", webp: "image/webp" })[(f.name || "").split(".").pop().toLowerCase()] || "";
  const keep = x => x.type === t ? x : new Blob([x], { type: t });
  if (t === "image/gif") return f.size <= 5e6 ? keep(f) : null;
  if (["image/png", "image/jpeg", "image/webp"].includes(t) && f.size <= 1.5e6) return keep(f);
  try {
    const bm = await createImageBitmap(f), k = Math.min(1, 1600 / Math.max(bm.width, bm.height));
    const c = document.createElement("canvas"); c.width = Math.round(bm.width * k); c.height = Math.round(bm.height * k);
    c.getContext("2d").drawImage(bm, 0, 0, c.width, c.height);
    const b = await new Promise(r => c.toBlob(r, "image/jpeg", 0.85)); return b && b.size <= 5e6 ? b : null;
  } catch (e) { return null; }
}
const chatUrls = {};
const chatImg = path => chatUrls[path] || (chatUrls[path] = sb.storage.from("chat").createSignedUrl(path, 3600).then(r => r.data ? r.data.signedUrl : null));
const EMOJIS = "😀 😁 😂 🤣 😊 😍 😘 😎 🤩 🥳 😢 😭 😡 😱 🤔 🙄 😴 🤗 🙏 👍 👎 👏 🙌 💪 🔥 ✨ 🎉 ❤️ 💔 💯 ✅ ❌ ⭐ 🎵 🎬 📷 📎 🌹 ☕ 🍕 🎁 🚀 💡 ⚡ 👀 🤝 😅 😉 🙂 😇 🥰 😋 😜 🤪 😏 😬 😮".split(" ");
async function chatPane(thread, title, back) {
  clearInterval(poll); $("view").onclick = null;
  $("view").innerHTML = `<div class="row" style="align-items:center;margin-bottom:.6rem">${back ? '<button class="s" id="c-back">← Back</button>' : ""}<h2 style="margin:0">${esc(title)}</h2></div>
    <div id="chat"></div><div class="mu" id="c-err" style="min-height:1.3em"></div><div id="emo" class="hide"></div>
    <div class="row"><button class="s i" id="c-emo" title="Emoji">😊</button><button class="s i" id="c-att" title="Send a picture / GIF">📎</button>
    <input id="c-in" maxlength="500" placeholder="Type a message… (paste a screenshot with Ctrl+V)" autocomplete="off"><button id="c-send">Send</button>
    <input type="file" id="c-file" class="hide" accept="image/*"></div>`;
  if (back) $("c-back").onclick = back;
  let last = 0, pend = null, marked = 0, seenRows = []; const mySeen = [], scope = thread || "public", seen = new Set(), canDel = m => thread ? me.role === "admin" : isStaff();
  const add = m => {
    if (seen.has(m.id)) return; seen.add(m.id);
    const mine = m.user_id === me.id, d = document.createElement("div"); d.className = "msg" + (mine ? " me" : "");
    const av = document.createElement("div"); av.className = "av sm"; av.textContent = (m.username || "?")[0].toUpperCase();
    const bub = document.createElement("div"); bub.className = "m" + (mine ? " me" : "");
    const hd = document.createElement("b"); hd.textContent = m.username;
    const bd = m.role === "admin" ? ["👑 Admin", "b-admin"] : m.role === "moderator" ? ["🛡️ Mod", "b-mod"] : m.vip ? ["⭐ VIP", "b-vip"] : null;
    if (bd) { const sp = document.createElement("span"); sp.className = "bdg " + bd[1]; sp.textContent = bd[0]; hd.append(" ", sp); }
    bub.append(hd);
    if (m.image_path) { const im = document.createElement("img"); im.className = "cimg"; im.alt = "picture"; chatImg(m.image_path).then(u => { if (u) im.src = u; }); im.onclick = () => im.src && window.open(im.src, "_blank", "noopener"); bub.append(im); }
    if (m.body) { const tx = document.createElement("div"); tx.textContent = m.body; bub.append(tx); }
    const t = document.createElement("i"); t.textContent = new Date(m.created_at).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }); bub.append(t);
    if (mine) { const sn = document.createElement("div"); sn.className = "seen"; bub.append(sn); mySeen.push([m.id, sn]); }
    if (canDel(m)) { const x = document.createElement("span"); x.className = "mx"; x.textContent = "✕"; x.title = "Delete";
      x.onclick = async () => { if (!confirm("Delete this message?")) return; if (m.image_path) await sb.storage.from("chat").remove([m.image_path]); await sb.rpc("chat_delete", { p_id: m.id }); d.remove(); }; bub.append(x); }
    d.append(av, bub); $("chat").append(d);
  };
  const pull = async () => {
    const { data, error } = await sb.rpc("chat_list", { p_after: last, p_thread: thread });
    if (!$("c-err")) return;
    if (error) return $("c-err").textContent = "Chat error: " + error.message;
    if (data && data.length) { data.forEach(m => { add(m); if (m.id > last) last = m.id; }); $("chat").scrollTop = 1e9; }
  };
  const markRead = () => { if (last > marked && document.visibilityState === "visible") { marked = last; sb.rpc("chat_mark_read", { p_scope: scope, p_last: last }); } };
  const paintSeen = () => {
    const others = seenRows.filter(r => r.user_id !== me.id);
    mySeen.forEach(([id, el]) => {
      const n = others.filter(r => r.last_id >= id).map(r => r.username);
      el.textContent = thread ? (n.length ? "✓✓ Seen" : "✓ Sent")
        : (n.length ? "👁 Seen by " + n.slice(0, 3).join(", ") + (n.length > 3 ? " +" + (n.length - 3) : "") : "✓ Sent");
      el.className = "seen" + (n.length ? " on" : ""); el.title = n.join(", ");
    });
  };
  const refreshSeen = async () => { const { data } = await sb.rpc("chat_seen", { p_scope: scope }); if (data && $("chat")) { seenRows = data; paintSeen(); } };
  const tick = async () => { await pull(); markRead(); await refreshSeen(); };
  document.onvisibilitychange = markRead;

    if (!f) { pend = null; $("c-err").textContent = ""; return; }

    const b = await prepImage(f);
    if (!b) return $("c-err").textContent = "Could not use that picture. Try PNG, JPG, GIF (under 5 MB) or WebP.";
    pend = b; $("c-err").textContent = "📷 Picture ready (" + fsize(b.size) + "): press Send. Tap here to remove.";
    $("c-err").style.cursor = "pointer"; $("c-err").onclick = () => setPend(null);
  };
  EMOJIS.forEach(e => { const sp = document.createElement("span"); sp.textContent = e; sp.onclick = () => { $("c-in").value += e; $("c-in").focus(); }; $("emo").append(sp); });
  $("c-emo").onclick = () => $("emo").classList.toggle("hide");
  $("c-att").onclick = () => $("c-file").click();
  $("c-file").onchange = e => { setPend(e.target.files[0]); e.target.value = ""; };
  $("c-in").addEventListener("paste", e => { const f = [...(e.clipboardData ? e.clipboardData.files : [])].find(x => x.type.startsWith("image/")); if (f) { e.preventDefault(); setPend(f); } });
  const send = async () => {
    const t = $("c-in").value.trim(); if (!t && !pend) return;

    if (pend) {
      img = me.id + "/" + crypto.randomUUID() + "." + ({ "image/png": "png", "image/jpeg": "jpg", "image/gif": "gif", "image/webp": "webp" })[pend.type];
      const up = await sb.storage.from("chat").upload(img, pend, { contentType: pend.type });
      if (up.error) { $("c-send").disabled = false; return $("c-err").textContent = "Upload failed: " + up.error.message; }
    }
    const { error } = await sb.rpc("chat_send", { p_body: t, p_image: img, p_thread: thread });
    $("c-send").disabled = false;
    if (error) return $("c-err").textContent = "Could not send: " + error.message;
    $("c-in").value = ""; pend = null; $("c-err").textContent = ""; $("emo").classList.add("hide"); tick(); $("c-in").focus();
  };
  $("c-send").onclick = send; $("c-in").onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); send(); } };
  await tick(); poll = setInterval(tick, 3000); $("c-in").focus();
}

async function adminView() {

    <div class="row"><select id="u-cat"><option value="videos">Video</option><option value="images">Photo</option><option value="audio">Audio / MP3</option><option value="files">Document</option><option value="games">Game</option></select>

    <input id="u-file" type="file" style="margin-top:.7rem"><input id="u-url" placeholder="…or paste a link: Backblaze B2, Google Drive or YouTube (for big files)">
    <button id="u-go">Publish</button><div class="mu" id="u-st" style="margin-top:.5rem"></div></div>
  <div class="card w"><h3>Accounts</h3><div class="wrap" id="acc"></div></div>

      const up = await sb.storage.from("vault").upload(path, f, { contentType: f.type || undefined });

    }
    const ins = await sb.from("files").insert({ name: title, description: $("u-desc").value.trim() || null, category: $("u-cat").value, path, ext_url: f ? null : ext, size: f ? f.size : null, vip_only: $("u-vip").checked });

    else if (d.rm) { if (!confirm("Remove this device?")) return; r = await sb.rpc("admin_remove_device", { did: d.rm }); } else return;

}
async function refresh() {

    sb.from("devices").select("*").order("last_seen", { ascending: false }), sb.from("activity").select("*").order("id", { ascending: false }).limit(100)]);
  const name = Object.fromEntries((p.data || []).map(u => [u.id, u.username]));
  $("acc").innerHTML = `<table><tr><th>User</th><th>Role</th><th>Status</th><th></th></tr>${(p.data || []).map(u => `<tr><td>${esc(u.username)}</td><td>${esc(u.role)}${u.vip ? " ⭐" : ""}</td><td><span class="st ${u.approved ? "ok" : "no"}">${u.approved ? "Approved" : "Pending"}</span></td>
    <td>${(u.role === "admin" || (u.role === "moderator" && me.role !== "admin")) ? "" : `<button class="${u.approved ? "d" : "g"}" data-u="${u.id}" data-v="${!u.approved}">${u.approved ? "Revoke" : "Approve"}</button> <button class="s" data-vip="${u.id}" data-v="${!u.vip}">${u.vip ? "Remove VIP" : "Make VIP"}</button>${me.role === "admin" ? ` <button class="s" data-role="${u.id}" data-v="${u.role === "moderator" ? "client" : "moderator"}">${u.role === "moderator" ? "Remove mod" : "Make mod"}</button>` : ""}`}</td></tr>`).join("")}</table>`;
  $("dev").innerHTML = `<table><tr><th>User</th><th>Device</th><th>IP</th><th>Last seen</th><th>Status</th><th></th></tr>${(d.data || []).map(x => {

    return `<tr><td>${esc(name[x.user_id])}</td><td>${esc(x.label)}</td><td>${esc(x.ip)}</td><td>${on ? "<span class='st ok'>● online</span>" : when(x.last_seen)}</td><td><span class="st ${x.approved ? "ok" : "no"}">${x.approved ? "Approved" : "Pending"}</span></td>
    <td><button class="${x.approved ? "s" : "g"}" data-dv="${x.id}" data-v="${!x.approved}">${x.approved ? "Block" : "Approve"}</button> <button class="d" data-rm="${x.id}">✕</button></td></tr>`; }).join("")}</table>`;
  $("act").innerHTML = `<table><tr><th>Time</th><th>User</th><th>Action</th><th>Detail</th><th>IP</th></tr>${(a.data || []).map(x =>
    `<tr><td class="mu">${when(x.created_at)}</td><td>${esc(x.username)}</td><td>${esc(x.action)}</td><td class="mu">${esc(x.detail)}</td><td>${esc(x.ip)}</td></tr>`).join("")}</table>`;

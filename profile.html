<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Enterprise Profile & Account Registry</title>
    <style>
        :root {
            --bg-dark: #090d16;
            --bg-card: rgba(17, 24, 39, 0.95);
            --border-color: rgba(55, 65, 81, 0.6);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-blue: #2563eb;
            --accent-cyan: #06b6d4;
            --accent-green: #059669;
            --accent-red: #dc2626;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body { background: linear-gradient(135deg, #030712 0%, #0f172a 50%, #1e1b4b 100%); color: var(--text-main); margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
        
        header { height: 65px; background: rgba(15, 23, 42, 0.95); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 1.5rem; flex-shrink: 0; }
        .logo-area { font-size: 1.1rem; font-weight: 700; color: #fff; cursor: pointer; }
        
        .container { max-width: 900px; margin: 2rem auto; width: 94%; flex: 1; }
        .profile-card { background: var(--bg-card); border: 1px solid var(--border-color); padding: 1.8rem; border-radius: 18px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); margin-bottom: 1.5rem; }
        
        .field-group { margin-bottom: 1.2rem; }
        .field-group label { display: block; font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.4rem; text-transform: uppercase; font-weight: 600; }
        .field-group input { width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 10px; background: rgba(3, 7, 18, 0.7); color: white; outline: none; font-size: 0.85rem; }

        .btn-row { display: flex; gap: 1rem; margin-top: 1.5rem; }
        button { padding: 0.8rem 1.4rem; border-radius: 10px; font-weight: 600; cursor: pointer; border: none; font-size: 0.85rem; }
        .btn-save { background: var(--accent-blue); color: white; flex: 1; }
        .btn-logout { background: var(--accent-red); color: white; }
        .btn-back { background: rgba(255,255,255,0.1); color: white; border: 1px solid var(--border-color); }

        table { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: 0.85rem; min-width: 650px; }
        th, td { border-bottom: 1px solid var(--border-color); padding: 0.8rem; text-align: left; }
        th { color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; }
        .table-responsive { width: 100%; overflow-x: auto; }
        .badge-device { background: rgba(6, 182, 212, 0.15); color: #22d3ee; padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; font-family: monospace; }
    </style>
</head>
<body>

    <header>
        <div class="logo-area" onclick="window.location.href='index.html'">🌐 Enterprise Vault Profile</div>
        <div style="display:flex; align-items:center; gap:1rem;">
            <button class="btn-back" onclick="window.location.href='index.html'">⬅️ Dashboard</button>
            <button class="btn-logout" onclick="logout()">🚪 Logout</button>
        </div>
    </header>

    <div class="container">
        <!-- Personal Profile Card -->
        <div class="profile-card">
            <h2 style="margin-top:0;">👤 My Account & Active Device Profile</h2>
            <hr style="border:none; border-bottom:1px solid var(--border-color); margin: 1.2rem 0;">

            <div class="field-group">
                <label>Username</label>
                <input type="text" id="prof-username" readonly style="opacity:0.6;">
            </div>

            <div class="field-group">
                <label>Assigned Email</label>
                <input type="text" id="prof-email">
            </div>

            <div class="field-group">
                <label>Current Live Active Hardware Device</label>
                <input type="text" id="prof-device" readonly style="font-family:monospace; color:var(--accent-cyan);">
            </div>

            <div class="field-group">
                <label>All Bound Devices</label>
                <input type="text" id="prof-devices-list" readonly style="font-family:monospace;">
            </div>

            <div class="btn-row">
                <button class="btn-save" onclick="updateProfileEmail()">Update Profile Email</button>
            </div>
            <div id="status-out" style="margin-top:1rem; font-size:0.85rem; text-align:center;"></div>
        </div>

        <!-- Admin All Accounts Viewer ("Anyone's account will be shown in that page") -->
        <div class="profile-card" id="admin-registry-card" style="display:none;">
            <h2>👑 Global Accounts Registry (Admin View)</h2>
            <p style="color:var(--text-muted); font-size:0.85rem;">Showing status, active devices, and details of all system accounts.</p>
            <div class="table-responsive">
                <div id="registry-table-container">Loading registry...</div>
            </div>
        </div>
    </div>

    <script>
        const GITHUB_REPO_OWNER = "nadianafish5-max";
        const GITHUB_VAULT_REPO = "perwebsonal";
        const tokA = "github_pat_11CLG5N3I0k";
        const tokB = "a4ywlHFWZm9_jvpLkxbPap";
        const tokC = "vBQlncSmFNVt6gNeQBkqRjI6Gh53drCUBPGR4ZTTYamYub8Sq";
        const GITHUB_TOKEN = tokA + tokB + tokC;

        let currentUser = localStorage.getItem("enterprise_active_user");
        let CLIENT_DB = {};
        let fileSha = "";

        function utoa(str) { return window.btoa(unescape(encodeURIComponent(str))); }
        function atou(str) { return decodeURIComponent(escape(window.atob(str))); }

        if (!currentUser) {
            window.location.href = "index.html";
        }

        window.onload = async function() {
            await loadProfileData();
        };

        async function loadProfileData() {
            const url = `https://api.github.com/repos/${GITHUB_REPO_OWNER}/${GITHUB_VAULT_REPO}/contents/users.json`;
            try {
                const res = await fetch(url, { headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Cache-Control': 'no-cache' } });
                if (res.ok) {
                    const data = await res.json();
                    fileSha = data.sha;
                    CLIENT_DB = JSON.parse(atou(data.content));
                    
                    if (CLIENT_DB[currentUser]) {
                        const u = CLIENT_DB[currentUser];
                        document.getElementById("prof-username").value = currentUser;
                        document.getElementById("prof-email").value = u.email || "";
                        document.getElementById("prof-device").value = u.currentActiveDevice || "Active Now";
                        document.getElementById("prof-devices-list").value = (u.allowedDevices || []).join(" | ");

                        // If user is admin, display the registry of all accounts
                        if (u.role === "admin") {
                            document.getElementById("admin-registry-card").style.display = "block";
                            renderAdminRegistryTable();
                        }
                    }
                }
            } catch(e) {}
        }

        async function updateProfileEmail() {
            const email = document.getElementById("prof-email").value.trim();
            const out = document.getElementById("status-out");
            if (!email) return alert("Enter valid email!");

            CLIENT_DB[currentUser].email = email;
            const url = `https://api.github.com/repos/${GITHUB_REPO_OWNER}/${GITHUB_VAULT_REPO}/contents/users.json`;
            
            const putRes = await fetch(url, {
                method: 'PUT',
                headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: `Update profile for ${currentUser}`, content: utoa(JSON.stringify(CLIENT_DB, null, 2)), sha: fileSha })
            });

            if (putRes.ok) {
                out.innerHTML = `<span style="color:var(--accent-green);">✅ Profile email updated successfully!</span>`;
                loadProfileData();
            } else {
                out.innerHTML = `<span style="color:var(--accent-red);">❌ Failed to update. Try again.</span>`;
            }
        }

        function renderAdminRegistryTable() {
            let container = document.getElementById("registry-table-container");
            let html = `<table><thead><tr><th>Username</th><th>Role</th><th>Email</th><th>Live Active Device</th><th>Bound Devices</th></tr></thead><tbody>`;
            
            for (let [u, data] of Object.entries(CLIENT_DB)) {
                let activeDev = data.currentActiveDevice ? `<span class="badge-device">📱 ${data.currentActiveDevice}</span>` : '<span style="color:var(--text-muted);">Offline</span>';
                html += `<tr>
                    <td><b>${u}</b> ${data.role === 'admin' ? '👑' : ''}</td>
                    <td>${data.role}</td>
                    <td>${data.email || 'N/A'}</td>
                    <td>${activeDev}<br><small style="color:var(--text-muted);">${data.lastActiveTime || ''}</small></td>
                    <td>${(data.allowedDevices || []).length} device(s)</td>
                </tr>`;
            }
            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        function logout() {
            localStorage.removeItem("enterprise_active_user");
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
